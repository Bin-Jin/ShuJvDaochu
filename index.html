  <script>
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    const DB_NAME = 'ImageCacheDB_MobileSync_V7';
    const DB_VERSION = 1;
    let db;

    let currentMode = localStorage.getItem('active_instrument_mode') || 'PAM';
    let isStickyEnabled = localStorage.getItem('enable_sticky_cols') !== 'false';
    let isRowStickyEnabled = localStorage.getItem('enable_sticky_row') !== 'false';

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains('images')) {
            const store = db.createObjectStore('images', { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
          }
        };
        request.onsuccess = (event) => {
          db = event.target.result;
          resolve();
        };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function saveImageToCache(id, base64Data) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.put({ id: id, data: base64Data, timestamp: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageFromCache(id) {
      if (!db) return null;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const store = tx.objectStore('images');
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.data : null);
        request.onerror = () => reject(request.error);
      });
    }

    async function pruneImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        const index = store.index('timestamp');
        const countReq = store.count();
        countReq.onsuccess = () => {
          if (countReq.result > 150) {
            let toDelete = countReq.result - 100;
            index.openCursor().onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor && toDelete > 0) {
                cursor.delete();
                toDelete--;
                cursor.continue();
              } else {
                resolve();
              }
            };
          } else {
            resolve();
          }
        };
      });
    }

    let filesState = []; 
    let allColumns = ["样本名称"];
    let isProcessing = false;

    const PAM_HEADERS = "protocol_id, Ambient Humidity, Ambient Pressure, Ambient Temperature, Chamber Temperature, ECS_tau, ECSt mAU, FmPrime, FoPrime, Fs, Fv over FmP, LEF, Leaf Temperature, Leaf Temperature Differenial, Light Intensity PAR, NPQt, P700 DIRK ampl, PS1 Active Centers, PS1 Open Centers, PS1 Over Reduced Centers, PS1 Oxidized Centers, Phi2, PhiNO, PhiNPQ, SPAD, gH+, kP700, leaf angle, leaf_thickness, pump, qL, tP700, test_data_raw_PAM, vH+, v_initial_P700";
    const NBI_HEADERS = "NBI, Chl, Flav";

    const clickUploadZone = document.getElementById('clickUploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyListTip = document.getElementById('emptyListTip');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const tablePlaceholder = document.getElementById('tablePlaceholder');
    const dataTable = document.getElementById('dataTable');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const targetHeadersInput = document.getElementById('targetHeadersInput');

    function updateModeUI() {
      const btnPAM = document.getElementById('btn-PAM');
      const btnNBI = document.getElementById('btn-NBI');
      const title = document.getElementById('header-title');

      if (currentMode === 'PAM') {
          btnPAM.className = "text-indigo-700 font-bold bg-white px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 shadow-sm transition-all text-[11px] sm:text-xs";
          btnNBI.className = "text-slate-500 hover:text-emerald-700 font-medium bg-transparent px-3 py-1.5 rounded-lg border border-transparent flex items-center gap-1.5 transition-all text-[11px] sm:text-xs";
          title.innerText = "光合仪";
      } else {
          btnNBI.className = "text-emerald-700 font-bold bg-white px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 shadow-sm transition-all text-[11px] sm:text-xs";
          btnPAM.className = "text-slate-500 hover:text-indigo-700 font-medium bg-transparent px-3 py-1.5 rounded-lg border border-transparent flex items-center gap-1.5 transition-all text-[11px] sm:text-xs";
          title.innerText = "氮平衡仪";
      }
    }

    function updateStickyBtnUI() {
      const btn = document.getElementById('toggleStickyBtn');
      if (!btn) return;
      if (isStickyEnabled) {
          btn.innerHTML = '<i class="fa-solid fa-unlock text-slate-400"></i> 解除列冻结';
          btn.className = "flex-1 sm:flex-none px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 text-[10px] sm:text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 border border-slate-200 shrink-0";
      } else {
          btn.innerHTML = '<i class="fa-solid fa-lock text-indigo-500"></i> 冻结首尾列';
          btn.className = "flex-1 sm:flex-none px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5 border border-indigo-200 shrink-0";
      }
    }

    function updateRowStickyBtnUI() {
      const btn = document.getElementById('toggleRowStickyBtn');
      if (!btn) return;
      if (isRowStickyEnabled) {
          btn.innerHTML = '<i class="fa-solid fa-unlock text-slate-400"></i> 解除首行冻结';
          btn.className = "flex-1 sm:flex-none px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 text-[10px] sm:text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 border border-slate-200 shrink-0";
      } else {
          btn.innerHTML = '<i class="fa-solid fa-lock text-indigo-500"></i> 冻结首行';
          btn.className = "flex-1 sm:flex-none px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5 border border-indigo-200 shrink-0";
      }
    }

    window.toggleSticky = function() {
        isStickyEnabled = !isStickyEnabled;
        localStorage.setItem('enable_sticky_cols', isStickyEnabled);
        updateStickyBtnUI();
        renderTable(); 
    };

    window.toggleRowSticky = function() {
        isRowStickyEnabled = !isRowStickyEnabled;
        localStorage.setItem('enable_sticky_row', isRowStickyEnabled);
        updateRowStickyBtnUI();
        renderTable(); 
    };

    window.setInstrument = function(mode) {
      if (currentMode === mode) return; 

      saveTableData();
      saveApiSettings();

      currentMode = mode;
      localStorage.setItem('active_instrument_mode', currentMode);
      
      updateModeUI();
      loadApiSettings();
      filesState = [];

    function createThumbnail(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 120; 
            let w = img.width, h = img.height;
            if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
            else if (h > MAX) { w *= MAX / h; h = MAX; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_SIZE = 4096; 
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.95)); 
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

      }
      saveTableData();

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function mapKeyToTarget(rawKey, targets) {
      let key = (rawKey || '').trim();
      let lower = key.toLowerCase().replace(/[_]+/g, ' ').replace(/\s+/g, ' ');

      for (const t of targets) {
        if (t.toLowerCase() === lower) return t;
      }

      const hasDiffTarget = targets.some(t => t.toLowerCase().includes('differen'));
      if (hasDiffTarget && (lower.includes('leaf temperature differen') || lower.includes('differential'))) {
        for (const t of targets) {
          if (t.toLowerCase().includes('differen')) return t;
        }
      }

      for (const t of targets) {
        let tLower = t.toLowerCase();
        if (lower.includes(tLower) || tLower.includes(lower)) return t;
      }
      return key;
    }

    let keyIndex = 0;
    
    async function processQueue() {
      if (isProcessing) return;
      isProcessing = true;

      const rawKeys = document.getElementById('apiKey').value;
      const keys = rawKeys.split(',').map(k => k.trim().replace(/[\u4e00-\u9fa5\s]/g, '')).filter(Boolean);
      
      if (keys.length === 0) {
          isProcessing = false;
          return;
      }

      const maxConcurrent = keys.length;

      async function worker() {
          while (true) {
              const pendingItem = filesState.find(f => f.status === 'pending');
              if (!pendingItem) break;
              
              pendingItem.status = 'processing';
              const modeAtStart = currentMode;
              updateQueueItemUI(pendingItem);
              
              const currentKey = keys[keyIndex % keys.length];
              keyIndex++;
              
              try {
                  let base64 = await getImageFromCache(pendingItem.id);
                  let retryCount = 0;
                  while (!base64 && retryCount < 10) {
                      await sleep(500);
                      base64 = await getImageFromCache(pendingItem.id);
                      retryCount++;
                  }

                  if (!base64) {
                     throw new Error('原图缓存已丢失，请重新拖入图片。');
                  }

                  const rawEntries = await callVisionApiEntries(base64, modeAtStart, currentKey);
                  
                  const savedHeadersStr = localStorage.getItem(`user_target_headers_${modeAtStart}_MobileSync`) || (modeAtStart === 'PAM' ? PAM_HEADERS : NBI_HEADERS);
                  const targets = savedHeadersStr.split(',').map(h => h.trim()).filter(Boolean);
                  
                  const alignedData = {};
                  rawEntries.forEach(([k, val]) => {
                    const standardKey = mapKeyToTarget(k, targets);
                    const strVal = (val !== undefined && val !== null) ? String(val).trim() : '';

                    if (strVal && strVal !== '-' && (alignedData[standardKey] === undefined || alignedData[standardKey] === '-' || alignedData[standardKey] === '')) {
                      alignedData[standardKey] = strVal;
                    } else if (alignedData[standardKey] === undefined) {
                      alignedData[standardKey] = strVal;
                    }
                  });

                  if (currentMode === modeAtStart) {
                      pendingItem.status = 'success';
                      pendingItem.data = alignedData;
                      
                      Object.keys(alignedData).forEach(standardKey => {
                          if (!allColumns.includes(standardKey) && standardKey !== "样本名称") {
                              allColumns.push(standardKey);
                          }
                      });

                      updateQueueItemUI(pendingItem);
                      renderTable();
                      updateUI();
                      saveTableData();
                  } else {
                      const bgStorageKey = `extracted_data_state_${modeAtStart}_MobileSync`;
                      const bgDataStr = localStorage.getItem(bgStorageKey);
                      if (bgDataStr) {
                          let bgFilesState = JSON.parse(bgDataStr);
                          const bgItem = bgFilesState.find(f => f.id === pendingItem.id);
                          if (bgItem) {
                              bgItem.status = 'success';
                              bgItem.data = alignedData;
                              localStorage.setItem(bgStorageKey, JSON.stringify(bgFilesState));
                          }
                      }
                  }
              } catch (err) {
                  if (currentMode === modeAtStart) {
                      pendingItem.status = 'error';
                      pendingItem.errorMsg = err.message || '识别失败';
                      updateQueueItemUI(pendingItem);
                      saveTableData();
                  } else {
                      const bgStorageKey = `extracted_data_state_${modeAtStart}_MobileSync`;
                      const bgDataStr = localStorage.getItem(bgStorageKey);
                      if (bgDataStr) {
                          let bgFilesState = JSON.parse(bgDataStr);
                          const bgItem = bgFilesState.find(f => f.id === pendingItem.id);
                          if (bgItem) {
                              bgItem.status = 'error';
                              bgItem.errorMsg = err.message || '识别失败';
                              localStorage.setItem(bgStorageKey, JSON.stringify(bgFilesState));
                          }
                      }
                  }
              }
              
              if (currentMode === modeAtStart) {
                  setTimeout(() => {
                    const wrapper = document.getElementById('tableWrapper');
                    if(wrapper) wrapper.scrollTop = wrapper.scrollHeight;
                  }, 50);
              }
              
              await sleep(300);
          }
      }

      const workers = [];
      for (let i = 0; i < maxConcurrent; i++) {
          workers.push(worker());
          await sleep(200);
      }
      
      await Promise.all(workers);
      isProcessing = false;
    }

    async function callVisionApiEntries(base64Url, modeForCall, activeKey) {
      let baseUrl = document.getElementById('apiBaseUrl').value.trim().replace(/\/+$/, '');
      const model = document.getElementById('apiModel').value.trim();

      if (!baseUrl.endsWith('/chat/completions')) baseUrl += '/chat/completions';

      const savedHeadersStr = localStorage.getItem(`user_target_headers_${modeForCall}_MobileSync`) || (modeForCall === 'PAM' ? PAM_HEADERS : NBI_HEADERS);
      const targets = savedHeadersStr.split(',').map(h => h.trim()).filter(Boolean);
      
      let specialNote = "";
      if (modeForCall === 'PAM') {
        specialNote = `\n【⚠️ 提取防错红线警告】：\n1. 务必全图扫描提取 "protocol_id" (通常在最顶部)。\n2. 严格区分 "Chamber Temperature"、"Ambient Temperature" 与 "Leaf Temperature"。如果图中**没有**某个指标(比如缺少 Chamber Temperature)，请【直接跳过，绝不允许张冠李戴】用其他温度去凑数！！找不到就不要输出该 key！\n3. "Leaf Temperature Differenial" (拼写可能少t)，绝对不能漏掉！`;
      } else if (modeForCall === 'NBI') {
        specialNote = `\n【⚠️ 氮平衡仪强制提取规则 (极其重要)】：\n图片为氮平衡仪屏幕，分为左右两列。左侧为指标(NBI, Chl, Flav)，右侧为系统参数(如 grp 1, mes 29, sup)。\n你【必须彻底无视右侧】的所有内容！绝对只提取左侧的 3 个纯数值！\n\n正确的返回格式必须是：\n{\n  "NBI": "57.9",\n  "Chl": "35.9",\n  "Flav": "0.62"\n}`;
      }

      const systemPrompt = `你是一个精密的科学仪器数据提取系统。请仔细观察图片，提取以下【目标指标列表】中的数值：
[${targets.join(', ')}]
${specialNote}

强制执行规则：
1. 请从上到下完整扫描图片，严格提取对应的数值。不要带任何单位，只要纯数字（包含小数点或负号）。
2. 【最高优先级红线警告】：绝对、永远、禁止输出任何形式的代码注释（如 // 或 /* */），绝对不要有任何多余的废话和标记！
3. 直接输出纯净的 JSON 字典。
返回格式如：
{
  "${targets[0] || 'protocol_id'}": "123.45"
}`;

      const response = await fetch(baseUrl, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'Authorization': `Bearer ${activeKey}` 
        },
        body: JSON.stringify({
          model: model,
          temperature: 0.01,
          messages: [
            { 
              role: "user", 
              content: [ 
                { type: "text", text: systemPrompt }, 
                { type: "image_url", image_url: { url: base64Url } } 
              ] 
            }
          ]
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        let errMsg = errJson.error?.message || `请求被拒绝 [HTTP ${response.status}]`;
        if (response.status === 404) errMsg = `[404] 模型 ${model} 不存在或地址有误`;
        if (response.status === 401) errMsg = `[401] 密钥无效`;
        if (response.status === 403) errMsg = `[403] 权限拒绝(并发受限/额度用尽)`;
        throw new Error(errMsg);
      }

      const res = await response.json();
      let rawText = res.choices?.[0]?.message?.content || '[]';
      
      let finalEntries = [];
      
      function extractPairs(obj) {
        if (typeof obj !== 'object' || obj === null) return;
        if (obj.key !== undefined && obj.value !== undefined) {
           finalEntries.push([String(obj.key), String(obj.value)]);
        } else {
           for (let k in obj) {
               finalEntries.push([String(k), String(obj[k])]);
           }
        }
      }

      let parsedData = null;
      try {
        let cleanText = rawText.replace(/```json/gi, '').replace(/```/g, '');
        cleanText = cleanText.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1').trim(); 
        
        const arrMatch = cleanText.match(/\[[\s\S]*\]/);
        const objMatch = cleanText.match(/\{[\s\S]*\}/);
        
        if (arrMatch) {
            parsedData = JSON.parse(arrMatch[0]);
        } else if (objMatch) {
            parsedData = JSON.parse(objMatch[0]);
        }
      } catch (e) {
         console.warn("标准 JSON 解析遇阻，已自动激活底层正则刮取引擎...");
      }

      if (parsedData) {
         if (Array.isArray(parsedData)) {
            parsedData.forEach(item => extractPairs(item));
         } else {
            extractPairs(parsedData);
         }
      }

      if (finalEntries.length === 0) {
         const regexKV = /"key"\s*:\s*"([^"]+)"\s*,\s*"value"\s*:\s*"?([^"}\s,\]]+)"?/gi;
         let regMatch;
         let matched = false;
         while ((regMatch = regexKV.exec(rawText)) !== null) {
            finalEntries.push([regMatch[1], regMatch[2]]);
            matched = true;
         }
         if (!matched) {
            const regexDict = /"([^"]+)"\s*:\s*"?([^"}\s,\]]+)"?/gi;
            while ((regMatch = regexDict.exec(rawText)) !== null) {
               if (regMatch[1].toLowerCase() === "key" || regMatch[1].toLowerCase() === "value") continue; 
               finalEntries.push([regMatch[1], regMatch[2]]);
            }
         }
      }

      if (finalEntries.length === 0) {
         throw new Error("AI 数据格式严重损坏，且强制还原失败。");
      }

      return finalEntries;
    }

    window.handleCellInteract = function(input, event) {
        if (!input.hasAttribute('readonly')) return; 

        const now = new Date().getTime();
        const lastClick = input.dataset.lastClick ? parseInt(input.dataset.lastClick) : 0;
        
        document.querySelectorAll('.cell-selected').forEach(el => {
            if (el !== input) {
                el.classList.remove('cell-selected');
                el.setAttribute('readonly', 'true');
            }
        });

        if (now - lastClick < 350) {
            input.removeAttribute('readonly');
            input.classList.remove('cell-selected');
            input.focus();
            input.select();
        } else {
            input.classList.add('cell-selected');
            input.blur(); 
        }
        input.dataset.lastClick = now;
    };

    }

    function updateQueueItemUI(item) {
      const el = document.getElementById(`queue_${item.id}`);
      if (!el) return;
      const statusBox = el.querySelector('.status-box');
      const deleteBtn = `<button onclick="deleteRowItem('${item.id}')" title="删除记录" class="w-5 h-5 sm:w-7 sm:h-7 rounded-md flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-trash-can"></i></button>`;

      if (item.status === 'pending') {
        statusBox.innerHTML = `<span class="text-[9px] sm:text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> 排队中</span> ${deleteBtn}`;
      } else if (item.status === 'processing') {
        statusBox.innerHTML = `<span class="text-[9px] sm:text-xs text-indigo-600 flex items-center gap-1 bg-indigo-50 px-1.5 py-0.5 sm:py-1 rounded-md"><i class="fa-solid fa-microscope text-indigo-500 animate-pulse"></i> 提取中</span>`;
      } else if (item.status === 'success') {
        statusBox.innerHTML = `
          <button onclick="retryItem('${item.id}')" title="重新识别" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 px-1 py-0.5 sm:py-1 rounded transition-all text-[9px] sm:text-[10px] font-semibold flex items-center gap-1 opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-rotate-right"></i> 重试</button>
          <span class="text-[9px] sm:text-xs text-emerald-600 flex items-center gap-1 bg-emerald-50 px-1.5 py-0.5 sm:py-1 rounded-md"><i class="fa-solid fa-check text-emerald-500"></i> 成功</span> 
          ${deleteBtn}`;
      } else if (item.status === 'error') {
        statusBox.innerHTML = `<button onclick="retryItem('${item.id}')" class="text-indigo-600 hover:text-white hover:bg-indigo-500 border border-indigo-200 px-1.5 py-0.5 sm:py-1 rounded transition-all shadow-sm text-[9px] sm:text-[10px]">重试</button>
                               <div class="relative group/tooltip">
                                 <span class="text-[9px] sm:text-xs text-rose-600 flex items-center gap-1 cursor-help bg-rose-50 px-1.5 py-0.5 sm:py-1 rounded-md"><i class="fa-solid fa-triangle-exclamation"></i> 失败</span>
                                 <div class="absolute right-0 bottom-full mb-2 hidden group-hover/tooltip:block w-48 sm:w-56 p-2 sm:p-2.5 bg-slate-800 text-white text-[10px] sm:text-[11px] leading-relaxed rounded-lg shadow-xl z-50 break-words font-normal">${escapeHtml(item.errorMsg)}</div>
                               </div>
                               ${deleteBtn}`;
      }
    }

    window.retryItem = async function(id) {
      const item = filesState.find(f => f.id === id);
      if (item) {
        item.status = 'pending'; 
        item.errorMsg = '';
        updateQueueItemUI(item); 
        saveTableData();
        if (!isProcessing) processQueue();
      }
    };

    window.deleteRowItem = async function(id) {
      filesState = filesState.filter(f => f.id !== id);
      const el = document.getElementById(`queue_${id}`);
      if (el) el.remove();
      if (filesState.length === 0) emptyListTip.classList.remove('hidden');
      renderTable(); updateUI(); saveTableData();
      
      if (db) {
         const tx = db.transaction('images', 'readwrite');
         tx.objectStore('images').delete(id);
      }
    };

    window.deleteColumn = function(colName) {
      if (confirm(`确定要删除整列【${colName}】吗？`)) {
        allColumns = allColumns.filter(c => c !== colName);
        filesState.forEach(item => { if (item.data && item.data[colName] !== undefined) delete item.data[colName]; });
        renderTable(); saveTableData();
      }
    };

    function renderTable() {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (successfulItems.length === 0) {
        tablePlaceholder.classList.remove('hidden'); dataTable.classList.add('hidden'); return;
      }
      tablePlaceholder.classList.add('hidden'); dataTable.classList.remove('hidden');

      const baseHeadClass = "bg-slate-100/95 backdrop-blur-md text-slate-600 shadow-sm border-slate-200 transition-all duration-300";
      const theadElement = document.getElementById('tableHead');
      if (isRowStickyEnabled) {
          theadElement.className = `${baseHeadClass} sticky top-0 z-[60]`;
      } else {
          theadElement.className = `${baseHeadClass} relative z-[40]`;
      }

      const stickyClassHeadLeft = isStickyEnabled ? 'sticky left-0 z-[45] shadow-[4px_0_8px_-2px_rgba(0,0,0,0.05)] bg-slate-100/95' : 'bg-slate-100/90';
      const stickyClassHeadRight = isStickyEnabled ? 'sticky right-0 z-[45] shadow-[-4px_0_8px_-2px_rgba(0,0,0,0.05)] bg-slate-100/95' : 'bg-slate-100/90';

      let headHtml = `<tr>`;
      allColumns.forEach((col, idx) => {
        const headBg = idx % 2 === 1 ? 'bg-slate-200/50' : 'bg-slate-100/90';
        if (col === "样本名称") {
           const thLeftClass = isStickyEnabled ? stickyClassHeadLeft : headBg;
           headHtml += `<th class="${thLeftClass} px-2 sm:px-4 py-2 sm:py-3.5 font-bold text-slate-800 whitespace-nowrap border-b border-slate-200 border-r border-slate-200/80 tracking-wide text-[10px] sm:text-xs text-center min-w-[90px] sm:min-w-[140px] transition-all duration-300"><span>${escapeHtml(col)}</span></th>`;
        } else {
           headHtml += `<th class="px-2 sm:px-4 py-2 sm:py-3.5 font-bold text-slate-700 whitespace-nowrap ${headBg} backdrop-blur-sm border-b border-slate-200 border-r border-slate-200/50 z-30 tracking-wide text-[10px] sm:text-xs text-center min-w-[90px] sm:min-w-[130px]">
              <div class="flex items-center justify-center gap-1 sm:gap-2 relative">
                <span>${escapeHtml(col)}</span>
                <button onclick="deleteColumn('${escapeHtml(col).replace(/'/g, "\\'")}')" class="absolute right-0 w-4 h-4 flex items-center justify-center rounded text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/th:opacity-100"><i class="fa-solid fa-xmark text-[9px] sm:text-[10px]"></i></button>
              </div>
            </th>`;
        }
      });
      headHtml += `<th class="${stickyClassHeadRight} px-2 sm:px-4 py-2 sm:py-3.5 font-bold text-slate-500 whitespace-nowrap border-b border-slate-200 border-l border-slate-200/80 text-center w-10 sm:w-14 text-[10px] sm:text-xs transition-all duration-300">操作</th></tr>`;

      if (tableHead.innerHTML !== headHtml) tableHead.innerHTML = headHtml;

      const currentIds = successfulItems.map(item => item.id);
      Array.from(tableBody.children).forEach(tr => {
          const rowId = tr.id.replace('row_', '');
          if (!currentIds.includes(rowId)) tr.remove();
      });

      successfulItems.forEach((item, index) => {
          let tr = document.getElementById(`row_${item.id}`);
          const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-slate-50/60';
          const stickyBgLeft = index % 2 === 0 ? 'bg-white/95' : 'bg-slate-50/95'; 

          if (!tr || tr.cells.length !== allColumns.length + 1 || tr.dataset.sticky !== String(isStickyEnabled)) {
              if (!tr) {
                  tr = document.createElement('tr');
                  tr.id = `row_${item.id}`;
              }
              tr.dataset.sticky = String(isStickyEnabled);
              tr.className = `transition-colors fade-in-row group/tr ${rowBg}`;
              tr.setAttribute('onmouseenter', `highlightPair('${item.id}', true)`);
              tr.setAttribute('onmouseleave', `highlightPair('${item.id}', false)`);

              let colHtml = '';
              allColumns.forEach((col, idx) => {
                const cellBg = idx % 2 === 1 ? 'bg-slate-100/50' : 'bg-transparent';
                if (col === "样本名称") {
                    const tdLeftClass = isStickyEnabled ? `sticky left-0 z-[35] shadow-[4px_0_8px_-2px_rgba(0,0,0,0.02)] ${stickyBgLeft} backdrop-blur-sm` : cellBg;
                    colHtml += `<td class="relative ${tdLeftClass} px-1 sm:px-2 py-1 font-sans border-b border-slate-100 border-r border-slate-200/80 whitespace-nowrap transition-all duration-300"><input type="text" data-index="${index}" data-col="样本名称" value="${escapeHtml(item.customName)}" title="${escapeHtml(item.customName)}" class="cell-input bg-transparent px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent rounded-md sm:rounded-lg outline-none transition-all w-full text-center text-[11px] sm:text-xs min-w-[75px] font-bold text-slate-800" readonly onclick="handleCellInteract(this, event)" onblur="handleCellBlur(this, '${item.id}', '样本名称')" onkeydown="handleCellKey(event, this)"></td>`;
                } else {
                    const val = item.data[col] !== undefined ? item.data[col] : '';
                    colHtml += `<td class="${cellBg} px-1 sm:px-2 py-1 border-b border-slate-100 border-r border-slate-100/50 whitespace-nowrap transition-colors text-center"><input type="text" data-index="${index}" value="${escapeHtml(val)}" class="cell-input bg-transparent px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent rounded-md sm:rounded-lg outline-none transition-all w-full placeholder:text-slate-200 text-center text-[11px] sm:text-xs min-w-[60px] text-slate-600" placeholder="-" readonly onclick="handleCellInteract(this, event)" onblur="handleCellBlur(this, '${item.id}', '${escapeHtml(col).replace(/'/g, "\\'")}')" onkeydown="handleCellKey(event, this)"></td>`;
                }
              });
              const tdRightClass = isStickyEnabled ? `sticky right-0 z-[35] shadow-[-4px_0_8px_-2px_rgba(0,0,0,0.02)] ${stickyBgLeft} backdrop-blur-sm` : '';
              colHtml += `<td class="${tdRightClass} px-1 sm:px-2 py-1 border-b border-slate-100 border-l border-slate-200/80 whitespace-nowrap text-center transition-all duration-300 group-hover/tr:bg-indigo-50/90"><button onclick="deleteRowItem('${item.id}')" class="w-5 h-5 sm:w-7 sm:h-7 mx-auto flex items-center justify-center rounded-md text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/tr:opacity-100"><i class="fa-solid fa-trash-can text-[10px] sm:text-[11px]"></i></button></td>`;
              tr.innerHTML = colHtml;
          } else {
              tr.className = `transition-colors group/tr ${rowBg}`; 
              allColumns.forEach((col, idx) => {
                  const input = tr.cells[idx].querySelector('input');
                  if (input) {
                      const expectedVal = col === "样本名称" ? item.customName : (item.data[col] !== undefined ? String(item.data[col]) : '');
                      if (input.value !== expectedVal && document.activeElement !== input) {
                          input.value = expectedVal;
                          if (col === "样本名称") input.title = expectedVal;
                      }
                  }
              });
          }

          if (tableBody.children[index] !== tr) {
              tableBody.insertBefore(tr, tableBody.children[index]);
          }
      });
    }

    exportCsvBtn.addEventListener('click', () => {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (!successfulItems.length) return;
      
      const aoa = [allColumns];
      successfulItems.forEach(item => {
        const row = allColumns.map(col => {
          if (col === "样本名称") return item.customName;
          let val = item.data[col] !== undefined ? item.data[col] : "";
          if(!isNaN(Number(val)) && val !== "") return Number(val);
          return val;
        });
        aoa.push(row);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "数据记录");
      
      const prefix = currentMode === 'PAM' ? '光合仪' : '氮平衡仪';
      XLSX.writeFile(wb, `${prefix}提取结果_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    clearAllBtn.addEventListener('click', async () => {
      if (!filesState.length) return;
      const name = currentMode === 'PAM' ? '光合仪' : '氮平衡仪';
      if (confirm(`确定要清空【${name}】工作区的所有缓存吗？\n注意：此操作不可恢复，但不会影响另一个仪器的数据。`)) {
        if (db) {
           const tx = db.transaction('images', 'readwrite');
           filesState.forEach(f => tx.objectStore('images').delete(f.id));
        }
        filesState = []; 
        updateColumnsFromInput();
        fileList.innerHTML = ''; 
        fileList.appendChild(emptyListTip);
        emptyListTip.classList.remove('hidden'); 
        renderTable(); 
        updateUI();
        localStorage.removeItem(getStorageKey());
      }
    });

    function updateUI() {
      fileCountBadge.innerText = `${filesState.length} 项`;
      exportCsvBtn.disabled = !filesState.some(f => f.status === 'success');
    }

    (async function initApp() {
      updateModeUI();
      updateStickyBtnUI();
      updateRowStickyBtnUI();
      loadApiSettings();
      try {
        await initDB();
      } catch (e) {
        console.warn("⚠️ 警告：无法启动本地图片数据库！如果处于无痕模式或微信内置浏览器，刷新后原图记忆会丢失。", e);
      }
      try {
        loadTableData();
      } catch (e) {
        console.error("加载记忆数据失败", e);
      }
    })();
  </script>
</body>
</html>
