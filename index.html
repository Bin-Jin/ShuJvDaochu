<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>光合仪/氮平衡仪 数据提取 - 双模版</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- 引入现代英文字体提升数据图表质感 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

</head>
<body class="bg-slate-50/50 text-slate-800 min-h-screen p-2 sm:p-4 md:p-8 relative selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">

          </span>
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">光合仪/氮平衡仪</span>

      </div>
      <div class="flex items-center gap-3 shrink-0">

    <!-- API 配置与手动指定指标输入框 -->

        <div class="flex flex-wrap gap-1.5 sm:gap-2 p-1 bg-slate-50 rounded-xl border border-slate-200 overflow-x-auto whitespace-nowrap scrollbar-hide">
          <button type="button" onclick="setPreset('gemini')" class="px-3 sm:px-4 py-1.5 text-[11px] sm:text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">谷歌 Gemini</button>
          <button type="button" onclick="setPreset('zhipu')" class="px-3 sm:px-4 py-1.5 text-[11px] sm:text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">智谱 GLM-4V</button>
          <button type="button" onclick="setPreset('qwen-max')" class="px-3 sm:px-4 py-1.5 text-[11px] sm:text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">通义千问 Max</button>
          <button type="button" onclick="setPreset('siliconflow')" class="px-3 sm:px-4 py-1.5 text-[11px] sm:text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">硅基流动</button>
        </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-5">
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">接口地址 (Base URL)</label>
          <input type="text" id="apiBaseUrl" class="w-full text-xs sm:text-sm bg-slate-50 px-3 sm:px-4 py-2 sm:py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">视觉模型 (Vision Model)</label>
          <input type="text" id="apiModel" class="w-full text-xs sm:text-sm bg-indigo-50/50 px-3 sm:px-4 py-2 sm:py-2.5 border border-indigo-100 rounded-xl input-glow outline-none transition-all font-bold text-indigo-700 font-mono">
        </div>
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">API 密钥 (API Key)</label>
          <input type="password" id="apiKey" class="w-full text-xs sm:text-sm bg-slate-50 px-3 sm:px-4 py-2 sm:py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
      </div>

      <div class="pt-4 sm:pt-5 border-t border-slate-100">
        <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <span>🎯 提取指标名称 <span class="text-slate-400 font-normal text-[10px] sm:text-xs sm:ml-2">（AI 将严格按此列表抓取数据）</span></span>
          
          <!-- 核心新增：多仪器预设按键 -->
          <div class="flex items-center gap-2 self-start sm:self-auto">
            <button type="button" onclick="setInstrument('PAM')" class="text-indigo-600 hover:text-indigo-800 transition-colors text-[10px] sm:text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-100 flex items-center gap-1.5 shadow-sm">
              <i class="fa-brands fa-pagelines"></i> 光合仪
            </button>
            <button type="button" onclick="setInstrument('NBI')" class="text-emerald-600 hover:text-emerald-800 transition-colors text-[10px] sm:text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg border border-emerald-100 flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-leaf"></i> 氮平衡仪
            </button>
          </div>
        </label>
        <textarea id="targetHeadersInput" rows="3" class="w-full text-[11px] sm:text-sm font-mono leading-relaxed px-3 sm:px-4 py-2 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700" placeholder="点击右上角按钮快速载入，或手动输入（逗号隔开）..."></textarea>
      </div>
    </div>

    <!-- 工作区 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 relative">
      <!-- 左侧：上传区与队列 -->
      <div class="space-y-4 sm:space-y-6 flex flex-col lg:sticky lg:top-[20px] lg:h-[calc(100vh-40px)] lg:self-start lg:col-span-1">
        
        <!-- 大按钮式上传区 -->
        <div id="clickUploadZone" class="bg-gradient-to-b from-indigo-50 to-white border-2 border-dashed border-indigo-200 hover:border-indigo-400 transition-all duration-300 py-6 sm:py-8 rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group shadow-sm hover:shadow-md hover:shadow-indigo-500/10 active:scale-[0.98]">
          <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white text-indigo-600 rounded-2xl flex items-center justify-center text-xl sm:text-2xl mb-3 sm:mb-4 shadow-md shadow-slate-200 border border-slate-100 transition-transform duration-300 group-hover:-translate-y-1 group-hover:scale-110">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
          </div>
          <h3 class="font-bold text-slate-700 text-sm sm:text-base mb-1">导入图表文件</h3>
          <p class="text-slate-400 text-[10px] sm:text-xs font-medium px-4">点击浏览或将图片拖拽至此</p>
        </div>

        <!-- 队列列表 (移动端限制高度，防止把表格挤到屏幕最下方) -->
        <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-lg shadow-slate-200/30 p-4 sm:p-5 flex flex-col flex-1 min-h-[150px] max-h-[35vh] lg:max-h-none lg:min-h-[300px] overflow-hidden">
          <div class="flex items-center justify-between pb-3 sm:pb-4 border-b border-slate-100 shrink-0">
            <span class="text-xs sm:text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-slate-400"></i> 解析列队
            </span>
            <span id="fileCountBadge" class="text-[9px] sm:text-[10px] font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 bg-slate-100 text-slate-600 rounded-full tracking-wider">0 项</span>
          </div>
          <div id="fileList" class="divide-y divide-slate-50 flex-1 overflow-y-auto mt-2 pb-2 pr-1 sm:pr-2 -mr-1 sm:-mr-2 space-y-1">
            <div id="emptyListTip" class="h-full flex flex-col items-center justify-center text-slate-300 gap-2 sm:gap-3 opacity-60 py-4">
              <i class="fa-regular fa-folder-open text-3xl sm:text-4xl"></i>
              <p class="text-[10px] sm:text-xs font-medium">暂无待处理文件</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧：数据表格区 -->
      <div class="lg:col-span-3 flex flex-col min-h-[500px] h-[60vh] lg:h-[calc(100vh-40px)]">
        <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-lg shadow-slate-200/40 p-4 sm:p-6 flex flex-col h-full relative overflow-hidden">
          
          <!-- 表格头部操作区 -->
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4 mb-4 sm:mb-5 shrink-0">
            <div>
              <h2 class="font-extrabold text-slate-800 text-lg sm:text-xl tracking-tight">结构化数据矩阵</h2>
              <p class="text-[10px] sm:text-xs text-slate-500 mt-1 font-medium">已自动去重并对齐。点击任何单元格即可修改。</p>
            </div>
            <button id="exportCsvBtn" disabled class="w-full sm:w-auto px-4 sm:px-5 py-2 sm:py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs sm:text-sm font-bold rounded-xl shadow-md shadow-emerald-500/20 transition-all duration-300 hover:shadow-emerald-500/40 sm:hover:-translate-y-0.5 flex items-center justify-center gap-2 shrink-0 border border-emerald-400/50">
              <i class="fa-solid fa-download"></i> 导出 CSV
            </button>
          </div>

          <!-- 表格核心渲染区 -->
          <div class="flex-1 overflow-auto rounded-xl sm:rounded-2xl border border-slate-200/60 bg-slate-50/30 relative shadow-inner" id="tableWrapper">
            <!-- 占位状态 -->
            <div id="tablePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-white/50 backdrop-blur-sm transition-opacity">
              <div class="w-12 h-12 sm:w-16 sm:h-16 bg-slate-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-3 sm:mb-4">
                <i class="fa-solid fa-table-list text-2xl sm:text-3xl text-slate-300"></i>
              </div>
              <p class="text-xs sm:text-sm font-medium">数据表将在此处生成</p>
            </div>
            
            <!-- 表格本体: 全局居中 -->
            <table id="dataTable" class="w-full text-[10px] sm:text-xs text-center border-collapse hidden relative">
              <thead id="tableHead" class="bg-slate-100/95 backdrop-blur-md text-slate-600 sticky top-0 z-20 shadow-sm border-b-2 border-slate-200"></thead>
              <tbody id="tableBody" class="divide-y divide-slate-100 font-mono text-slate-700 bg-white"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    const DB_NAME = 'ImageCacheDB_MultiDevice';
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains('images')) {
            const store = db.createObjectStore('images', { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
          }
        };
        request.onsuccess = (event) => {
          db = event.target.result;
          resolve();
        };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function saveImageToCache(id, base64Data) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.put({ id: id, data: base64Data, timestamp: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageFromCache(id) {
      if (!db) return null;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const store = tx.objectStore('images');
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.data : null);
        request.onerror = () => reject(request.error);
      });
    }

    async function pruneImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        const index = store.index('timestamp');
        const countReq = store.count();
        countReq.onsuccess = () => {
          if (countReq.result > 50) {
            let toDelete = countReq.result - 50;
            index.openCursor().onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor && toDelete > 0) {
                cursor.delete();
                toDelete--;
                cursor.continue();
              } else {
                resolve();
              }
            };
          } else {
            resolve();
          }
        };
      });
    }

    async function clearImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.clear().onsuccess = resolve;
      });
    }

    let filesState = []; 
    let allColumns = ["样本名称"];
    let isProcessing = false;

    // 🌟 定义两种仪器的默认指标库
    const PAM_HEADERS = "protocol_id, Ambient Humidity, Ambient Pressure, Ambient Temperature, Chamber Temperature, ECS_tau, ECSt mAU, FmPrime, FoPrime, Fs, Fv over FmP, LEF, Leaf Temperature, Leaf Temperature Differenial, Light Intensity PAR, NPQt, P700 DIRK ampl, PS1 Active Centers, PS1 Open Centers, PS1 Over Reduced Centers, PS1 Oxidized Centers, Phi2, PhiNO, PhiNPQ, SPAD, gH+, kP700, leaf angle, leaf_thickness, pump, qL, tP700, test_data_raw_PAM, vH+, v_initial_P700";
    const NBI_HEADERS = "NBI, Chl, Flav";

    const clickUploadZone = document.getElementById('clickUploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyListTip = document.getElementById('emptyListTip');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const tablePlaceholder = document.getElementById('tablePlaceholder');
    const dataTable = document.getElementById('dataTable');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const targetHeadersInput = document.getElementById('targetHeadersInput');

    function setPreset(type) {
      if (type === 'gemini') {
        document.getElementById('apiBaseUrl').value = 'https://generativelanguage.googleapis.com/v1beta/openai';
        document.getElementById('apiModel').value = 'gemini-1.5-flash';
      } else if (type === 'zhipu') {
        document.getElementById('apiBaseUrl').value = 'https://open.bigmodel.cn/api/paas/v4';
        document.getElementById('apiModel').value = 'glm-4v-flash';
      } else if (type === 'qwen-max') {
        document.getElementById('apiBaseUrl').value = 'https://dashscope.aliyuncs.com/compatible-mode/v1';
        document.getElementById('apiModel').value = 'qwen-vl-max';
      } else if (type === 'siliconflow') {
        document.getElementById('apiBaseUrl').value = 'https://api.siliconflow.cn/v1';
        document.getElementById('apiModel').value = 'Qwen/Qwen2-VL-7B-Instruct';
      }
      saveApiSettings();
    }

    // 🌟 一键切换仪器目标库
    window.setInstrument = function(type) {
      if (type === 'PAM') {
        targetHeadersInput.value = PAM_HEADERS;
      } else if (type === 'NBI') {
        targetHeadersInput.value = NBI_HEADERS;
      }
      saveApiSettings();
    };

    function loadApiSettings() {
      document.getElementById('apiBaseUrl').value = localStorage.getItem('api_base_url') || 'https://generativelanguage.googleapis.com/v1beta/openai';
      document.getElementById('apiModel').value = localStorage.getItem('api_model') || 'gemini-1.5-flash';
      document.getElementById('apiKey').value = localStorage.getItem('api_key') || '';
      
      const savedHeaders = localStorage.getItem('user_target_headers_multidevice');
      targetHeadersInput.value = savedHeaders || PAM_HEADERS;
      
      updateColumnsFromInput();
    }

    function saveApiSettings() {
      localStorage.setItem('api_base_url', document.getElementById('apiBaseUrl').value.trim());
      localStorage.setItem('api_model', document.getElementById('apiModel').value.trim());
      localStorage.setItem('api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('user_target_headers_multidevice', targetHeadersInput.value.trim());
      updateColumnsFromInput();
    }

    function updateColumnsFromInput() {
      const raw = targetHeadersInput.value.split(',');
      const parsed = raw.map(h => h.trim()).filter(Boolean);
      if (parsed.length > 0) {
        allColumns = ["样本名称", ...parsed];
        renderTable();
      }
    }

    targetHeadersInput.addEventListener('input', saveApiSettings);
    ['apiBaseUrl', 'apiModel', 'apiKey'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveApiSettings);
    });

    function saveTableData() {
      const stateToSave = filesState.map(f => ({
        id: f.id, customName: f.customName, status: f.status, data: f.data, errorMsg: f.errorMsg
      }));
      localStorage.setItem('extracted_data_state_multidevice', JSON.stringify(stateToSave));
    }

    function loadTableData() {
      const savedState = localStorage.getItem('extracted_data_state_multidevice');
      if (savedState) {
        filesState = JSON.parse(savedState);
        if (filesState.length > 0) {
          emptyListTip.classList.add('hidden');
          filesState.forEach(item => {
            if (item.status === 'processing') item.status = 'pending';
            renderQueueItemDOM(item);
          });
          renderTable();
          updateUI();
          if (filesState.some(f => f.status === 'pending') && !isProcessing) {
              processQueue();
          }
        }
      }
    }

    const globalDropZone = document.getElementById('globalDropZone');
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        globalDropZone.classList.add('flex');
        globalDropZone.classList.remove('hidden');
      }
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        globalDropZone.classList.add('hidden');
        globalDropZone.classList.remove('flex');
      }
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      globalDropZone.classList.add('hidden');
      globalDropZone.classList.remove('flex');
      if (e.dataTransfer.files.length) handleNewFiles(e.dataTransfer.files);
    });

    clickUploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleNewFiles(e.target.files);
      fileInput.value = '';
    });

    async function handleNewFiles(files) {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { alert('请先在上方填入 API 密钥！'); return; }
      
      for (const file of Array.from(files)) {
        if (!file.type.startsWith('image/')) continue;
        const fileId = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const item = { id: fileId, customName: file.name.replace(/\.[^/.]+$/, ""), status: 'pending', data: null, file: file, errorMsg: '' };
        filesState.push(item);
        renderQueueItemDOM(item);
        setTimeout(() => fileList.scrollTop = fileList.scrollHeight, 50);
      }
      saveTableData();
      updateUI();
      if (!isProcessing) processQueue();
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_SIZE = 1200;
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function getTargetHeaders() {
      const raw = targetHeadersInput.value.split(',');
      return raw.map(h => h.trim()).filter(Boolean);
    }

    // 智能映射：光合仪容错及通用对齐
    function mapKeyToTarget(rawKey, targets) {
      let key = (rawKey || '').trim();
      let lower = key.toLowerCase().replace(/[_]+/g, ' ').replace(/\s+/g, ' ');

      // 如果目标包含光合仪特有温差，启用强力容错
      const hasDiffTarget = targets.some(t => t.toLowerCase().includes('differen'));
      if (hasDiffTarget && (lower.includes('leaf temperature differen') || lower.includes('differential'))) {
        for (const t of targets) {
          if (t.toLowerCase().includes('differen')) return t;
        }
      }

      for (const t of targets) {
        let tLower = t.toLowerCase();
        if (lower === tLower || lower.includes(tLower) || tLower.includes(lower)) return t;
      }
      return key;
    }

    async function processQueue() {
      isProcessing = true;
      while (true) {
        const pendingItem = filesState.find(f => f.status === 'pending');
        if (!pendingItem) break;
        
        pendingItem.status = 'processing';
        updateQueueItemUI(pendingItem);
        
        try {
          let base64 = await getImageFromCache(pendingItem.id);
          
          if (!base64) {
            if (pendingItem.file) {
              base64 = await compressImageToBase64(pendingItem.file);
              await saveImageToCache(pendingItem.id, base64);
              await pruneImageCache();
            } else {
              throw new Error('原图缓存已过期，请再次导入图片（部署后跨域无法提取本地图片）');
            }
          }

          const rawEntries = await callVisionApiEntries(base64);
          const targets = getTargetHeaders();
          const alignedData = {};

          rawEntries.forEach(([k, val]) => {
            const standardKey = mapKeyToTarget(k, targets);
            const strVal = (val !== undefined && val !== null) ? String(val).trim() : '';

            if (strVal && strVal !== '-' && (alignedData[standardKey] === undefined || alignedData[standardKey] === '-' || alignedData[standardKey] === '')) {
              alignedData[standardKey] = strVal;
            } else if (alignedData[standardKey] === undefined) {
              alignedData[standardKey] = strVal;
            }
            
            if (!allColumns.includes(standardKey) && standardKey !== "样本名称") {
              allColumns.push(standardKey);
            }
          });

          pendingItem.status = 'success';
          pendingItem.data = alignedData;

        } catch (err) {
          pendingItem.status = 'error';
          pendingItem.errorMsg = err.message || '识别失败';
        }
        
        updateQueueItemUI(pendingItem);
        renderTable();
        updateUI();
        saveTableData();
        
        setTimeout(() => {
          const wrapper = document.getElementById('tableWrapper');
          wrapper.scrollTop = wrapper.scrollHeight;
        }, 50);

        await sleep(1000);
      }
      isProcessing = false;
    }

    async function callVisionApiEntries(base64Url) {
      let baseUrl = document.getElementById('apiBaseUrl').value.trim().replace(/\/+$/, '');
      const model = document.getElementById('apiModel').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim().replace(/[\u4e00-\u9fa5\s]/g, '');

      if (!baseUrl.endsWith('/chat/completions')) baseUrl += '/chat/completions';

      const targets = getTargetHeaders();
      const targetsStr = targets.join(', ').toLowerCase();
      
      // 🌟 根据选择的仪器，动态装载强调提示词
      let specialNote = "";
      if (targetsStr.includes("differenial") || targetsStr.includes("differential")) {
        specialNote = `\n【⚠️ 温差字段特殊提醒】：\n图片中包含有 "Leaf Temperature Differenial"（温差行，屏幕拼写可能为 Differenial 或 Differential），绝对不能漏掉！必须将其数值准确提取出来。`;
      } else if (targetsStr.includes("nbi") && targetsStr.includes("chl")) {
        specialNote = `\n【⚠️ 氮平衡仪提取提醒】：\n图片为氮平衡仪(Dualex/Force-A)屏幕，请重点准确提取 NBI, Chl, Flav 三个关键指标的数值。`;
      }

      const systemPrompt = `你是一个精密的科学仪器屏幕数据提取助手。请仔细观察图片，重点提取以下【用户指定的指标列表】中的数值：
[${targets.join(', ')}]
${specialNote}

规则：
1. 请从上到下完整扫描图片每一行，将上述列表中的指标完整提取出来。
2. 请以 JSON 数组对象形式返回，格式如：
[
  {"key": "protocol_id", "value": "3357"},
  {"key": "Leaf Temperature Differenial", "value": "-5.35"}
]
3. 严禁省略中间的数据，不允许出现 "..."。只返回纯 JSON 数组，不要有多余的 markdown 标记。`;

      const response = await fetch(baseUrl, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'Authorization': `Bearer ${apiKey}` 
        },
        body: JSON.stringify({
          model: model,
          temperature: 0.01,
          messages: [
            { 
              role: "user", 
              content: [ 
                { type: "text", text: systemPrompt }, 
                { type: "image_url", image_url: { url: base64Url } } 
              ] 
            }
          ]
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        let errMsg = errJson.error?.message || `请求被拒绝 [HTTP ${response.status}]`;
        if (response.status === 404) errMsg = `[404] 模型 ${model} 不存在或地址有误`;
        if (response.status === 401) errMsg = `[401] 密钥无效`;
        if (response.status === 403) errMsg = `[403] 权限拒绝(请检查额度/模型权限)`;
        throw new Error(errMsg);
      }

      const res = await response.json();
      let rawText = res.choices?.[0]?.message?.content || '[]';
      
      const match = rawText.match(/\[[\s\S]*\]/);
      if (match) rawText = match[0];
      else throw new Error("AI 返回格式异常，未能提取到 JSON 数组数据");
      
      const parsedArray = JSON.parse(rawText);
      return parsedArray.map(item => [item.key, item.value]);
    }

    function renderQueueItemDOM(item) {
      emptyListTip.classList.add('hidden');
      const div = document.createElement('div');
      div.id = `queue_${item.id}`;
      div.className = 'py-2.5 sm:py-3 px-2 sm:px-3 rounded-xl transition-all duration-200 flex items-center justify-between gap-2 sm:gap-3 group/item hover:bg-slate-50 border border-transparent hover:border-slate-100 fade-in-row mt-1';
      div.innerHTML = `
        <div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-indigo-50 text-indigo-400 flex items-center justify-center shrink-0">
            <i class="fa-regular fa-image text-[10px] sm:text-xs"></i>
          </div>
          <input type="text" value="${escapeHtml(item.customName)}" title="修改样本名称" 
                 class="name-input text-[11px] sm:text-xs font-bold text-slate-700 bg-transparent hover:bg-white focus:bg-white px-2 py-1.5 border border-transparent focus:border-indigo-400 rounded-md outline-none truncate w-full transition-all focus:ring-2 focus:ring-indigo-100"
                 onchange="updateItemName('${item.id}', this.value)">
        </div>
        <div class="status-box flex items-center gap-1 sm:gap-2 shrink-0 font-medium"></div>
      `;
      fileList.appendChild(div);
      updateQueueItemUI(item);
    }

    function updateQueueItemUI(item) {
      const el = document.getElementById(`queue_${item.id}`);
      if (!el) return;
      const statusBox = el.querySelector('.status-box');
      const deleteBtn = `<button onclick="deleteRowItem('${item.id}')" title="删除记录" class="w-6 h-6 sm:w-7 sm:h-7 rounded-md flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-trash-can"></i></button>`;

      if (item.status === 'pending') {
        statusBox.innerHTML = `<span class="text-[10px] sm:text-xs text-slate-400 flex items-center gap-1 sm:gap-1.5"><i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> 排队中</span> ${deleteBtn}`;
      } else if (item.status === 'processing') {
        statusBox.innerHTML = `<span class="text-[10px] sm:text-xs text-indigo-600 flex items-center gap-1 sm:gap-1.5 bg-indigo-50 px-2 py-1 rounded-md"><i class="fa-solid fa-microscope text-indigo-500 animate-pulse"></i> 提取中</span>`;
      } else if (item.status === 'success') {
        statusBox.innerHTML = `
          <button onclick="retryItem('${item.id}')" title="重新识别" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 px-1.5 sm:px-2 py-1 rounded transition-all text-[9px] sm:text-[10px] mr-0.5 sm:mr-1 font-semibold flex items-center gap-1 opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-rotate-right"></i> 重试</button>
          <span class="text-[10px] sm:text-xs text-emerald-600 flex items-center gap-1 sm:gap-1.5 bg-emerald-50 px-2 py-1 rounded-md"><i class="fa-solid fa-check text-emerald-500"></i> 成功</span> 
          ${deleteBtn}`;
      } else if (item.status === 'error') {
        statusBox.innerHTML = `<button onclick="retryItem('${item.id}')" class="text-indigo-600 hover:text-white hover:bg-indigo-500 border border-indigo-200 px-1.5 sm:px-2 py-1 rounded transition-all mr-0.5 sm:mr-1 shadow-sm text-[10px]">重试</button>
                               <div class="relative group/tooltip">
                                 <span class="text-[10px] sm:text-xs text-rose-600 flex items-center gap-1 sm:gap-1.5 cursor-help bg-rose-50 px-2 py-1 rounded-md"><i class="fa-solid fa-triangle-exclamation"></i> 失败</span>
                                 <div class="absolute right-0 bottom-full mb-2 hidden group-hover/tooltip:block w-48 sm:w-56 p-2 sm:p-2.5 bg-slate-800 text-white text-[10px] sm:text-[11px] leading-relaxed rounded-lg shadow-xl z-50 break-words font-normal">${escapeHtml(item.errorMsg)}</div>
                               </div>
                               ${deleteBtn}`;
      }
    }

    window.retryItem = async function(id) {
      const item = filesState.find(f => f.id === id);
      if (item) {
        item.status = 'pending'; 
        item.errorMsg = '';
        updateQueueItemUI(item); 
        saveTableData();
        if (!isProcessing) processQueue();
      }
    };

    window.deleteRowItem = async function(id) {
      filesState = filesState.filter(f => f.id !== id);
      const el = document.getElementById(`queue_${id}`);
      if (el) el.remove();
      if (filesState.length === 0) emptyListTip.classList.remove('hidden');
      renderTable(); updateUI(); saveTableData();
      
      if (db) {
         const tx = db.transaction('images', 'readwrite');
         tx.objectStore('images').delete(id);
      }
    };

    window.deleteColumn = function(colName) {
      if (confirm(`确定要删除整列【${colName}】吗？`)) {
        allColumns = allColumns.filter(c => c !== colName);
        filesState.forEach(item => { if (item.data && item.data[colName] !== undefined) delete item.data[colName]; });
        renderTable(); saveTableData();
      }
    };

    window.updateItemName = function(id, newName) {
      const item = filesState.find(f => f.id === id);
      if (item) {
        item.customName = newName.trim() || item.customName;
        const leftInput = document.querySelector(`#queue_${id} .name-input`);
        if (leftInput) leftInput.value = item.customName;
        renderTable(); saveTableData();
      }
    };

    window.updateCellValue = function(id, col, newValue) {
      const item = filesState.find(f => f.id === id);
      if (item && item.data) { item.data[col] = newValue.trim(); saveTableData(); }
    };

    function renderTable() {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (successfulItems.length === 0) {
        tablePlaceholder.classList.remove('hidden'); dataTable.classList.add('hidden'); return;
      }
      tablePlaceholder.classList.add('hidden'); dataTable.classList.remove('hidden');

      tableHead.innerHTML = `<tr>${allColumns.map((col, idx) => {
        const headBg = idx % 2 === 1 ? 'bg-slate-200/50' : 'bg-slate-100/90';
        if (col === "样本名称") return `<th class="px-2 sm:px-4 py-2.5 sm:py-3.5 font-bold text-slate-700 whitespace-nowrap ${headBg} backdrop-blur-sm border-b border-slate-200 border-r border-slate-200/50 z-30 tracking-wide text-[10px] sm:text-xs text-center shadow-[4px_0_8px_-4px_rgba(0,0,0,0.02)]"><span>${escapeHtml(col)}</span></th>`;
        return `<th class="px-2 sm:px-4 py-2.5 sm:py-3.5 font-bold text-slate-700 whitespace-nowrap ${headBg} backdrop-blur-sm border-b border-slate-200 border-r border-slate-200/50 group/th min-w-[100px] sm:min-w-[130px] z-30 tracking-wide text-[10px] sm:text-xs text-center">
          <div class="flex items-center justify-center gap-1 sm:gap-2 relative">
            <span>${escapeHtml(col)}</span>
            <button onclick="deleteColumn('${escapeHtml(col).replace(/'/g, "\\'")}')" class="absolute right-0 w-4 h-4 sm:w-5 sm:h-5 flex items-center justify-center rounded text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/th:opacity-100"><i class="fa-solid fa-xmark text-[9px] sm:text-[10px]"></i></button>
          </div>
        </th>`;
      }).join('')}<th class="px-2 sm:px-4 py-2.5 sm:py-3.5 font-bold text-slate-400 whitespace-nowrap bg-slate-100/90 backdrop-blur-sm border-b border-slate-200 text-center sticky right-0 z-40 w-10 sm:w-14 shadow-[-8px_0_12px_-4px_rgba(0,0,0,0.03)] text-[10px] sm:text-xs">操作</th></tr>`;

      tableBody.innerHTML = successfulItems.map((item, index) => {
        const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-slate-50/40';
        return `<tr class="hover:bg-indigo-50/40 transition-colors fade-in-row group/tr ${rowBg}">
          ${allColumns.map((col, idx) => {
            const cellBg = idx % 2 === 1 ? 'bg-slate-100/50' : 'bg-transparent';
            if (col === "样本名称") return `<td class="px-1 sm:px-2 py-1 font-sans font-bold text-slate-800 border-b border-slate-100 border-r border-slate-100/50 whitespace-nowrap ${cellBg}"><input type="text" value="${escapeHtml(item.customName)}" class="bg-transparent hover:bg-white focus:bg-white px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-md sm:rounded-lg outline-none transition-all w-full text-center text-[10px] sm:text-xs" onchange="updateItemName('${item.id}', this.value)"></td>`;
            const val = item.data[col] !== undefined ? item.data[col] : '';
            return `<td class="px-1 sm:px-2 py-1 border-b border-slate-100 border-r border-slate-100/50 whitespace-nowrap ${cellBg} transition-colors text-center"><input type="text" value="${escapeHtml(val)}" class="text-slate-600 bg-transparent hover:bg-slate-50 focus:bg-white px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-md sm:rounded-lg outline-none transition-all w-full placeholder:text-slate-200 text-center text-[10px] sm:text-xs" placeholder="-" onchange="updateCellValue('${item.id}', '${escapeHtml(col).replace(/'/g, "\\'")}', this.value)"></td>`;
          }).join('')}<td class="px-1 sm:px-2 py-1 border-b border-slate-100 whitespace-nowrap text-center sticky right-0 z-10 shadow-[-8px_0_12px_-4px_rgba(0,0,0,0.02)] group-hover/tr:bg-indigo-50/40 transition-colors bg-white"><button onclick="deleteRowItem('${item.id}')" class="w-6 h-6 sm:w-7 sm:h-7 mx-auto flex items-center justify-center rounded-md text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/tr:opacity-100"><i class="fa-solid fa-trash-can text-[10px] sm:text-[11px]"></i></button></td></tr>`;
      }).join('');
    }

    exportCsvBtn.addEventListener('click', () => {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (!successfulItems.length) return;
      const headerLine = allColumns.map(c => `"${c.replace(/"/g, '""')}"`).join(',');
      const rowLines = successfulItems.map(item => {
        return allColumns.map(col => `"${String(col === "样本名称" ? item.customName : (item.data[col] !== undefined ? item.data[col] : "")).replace(/"/g, '""')}"`).join(',');
      });
      const blob = new Blob(["\uFEFF" + [headerLine, ...rowLines].join("\r\n")], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `科学数据提取结果_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });

    clearAllBtn.addEventListener('click', async () => {
      if (!filesState.length) return;
      if (confirm('是否确定清空当前工作区的所有数据和图片缓存？\n\n注意：此操作不可恢复。')) {
        filesState = []; 
        updateColumnsFromInput();
        fileList.innerHTML = ''; 
        fileList.appendChild(emptyListTip);
        emptyListTip.classList.remove('hidden'); 
        renderTable(); 
        updateUI();
        localStorage.removeItem('extracted_data_state_multidevice');
        await clearImageCache();
      }
    });

    function updateUI() {
      fileCountBadge.innerText = `${filesState.length} 项`;
      exportCsvBtn.disabled = !filesState.some(f => f.status === 'success');
    }

    // 强力安全启动层
    (async function initApp() {
      loadApiSettings();
      try {
        await initDB();
      } catch (e) {
        console.warn("⚠️ 警告：无法启动本地图片数据库！如果处于无痕模式或微信内置浏览器，刷新后原图记忆会丢失。", e);
      }
      try {
        loadTableData();
      } catch (e) {
        console.error("加载记忆数据失败", e);
      }
    })();
  </script>
</body>
</html>
