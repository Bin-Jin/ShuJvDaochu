<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光合仪数据提取</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- 引入现代英文字体提升数据图表质感 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    /* 极致丝滑的滚动条 */
    ::-webkit-scrollbar { height: 8px; width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 数据行动画 */
    .fade-in-row { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 悬浮聚焦发光特效 */
    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      border-color: #818cf8;
      background-color: #fff;
    }
  </style>
</head>
<body class="bg-slate-50/50 text-slate-800 min-h-screen p-4 md:p-8 relative selection:bg-indigo-100 selection:text-indigo-900">
  
  <!-- 拖拽全局覆盖层 -->
  <div id="globalDropZone" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-white/80 backdrop-blur-md border-[12px] border-indigo-500/20 m-4 rounded-[2.5rem] transition-all duration-300">
    <div class="pointer-events-none flex flex-col items-center scale-110">
      <div class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-full flex items-center justify-center shadow-2xl shadow-indigo-500/40 mb-6 animate-bounce">
        <i class="fa-solid fa-cloud-arrow-up text-5xl text-white"></i>
      </div>
      <h2 class="text-4xl font-bold mb-3 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-violet-700">松开鼠标，开始识别</h2>
      <p class="text-slate-500 text-lg font-medium">支持大批量拖拽，AI 将自动接管一切</p>
    </div>
  </div>

  <div class="max-w-[1400px] mx-auto space-y-8">
    
    <!-- 顶部标题栏 (毛玻璃悬浮效果) -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white/70 backdrop-blur-xl p-6 md:px-8 md:py-6 rounded-3xl shadow-xl shadow-slate-200/40 border border-white sticky top-4 z-50 transition-all">
      <div>
        <h1 class="text-3xl font-extrabold flex items-center gap-3 tracking-tight">
          <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white">
            <i class="fa-solid fa-microscope text-[18px]"></i>
          </span>
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">光合仪</span> 
          <span class="text-slate-800">数据提取</span>
          <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-semibold border border-indigo-100 ml-2">Pro V2</span>
        </h1>
        <p class="text-sm text-slate-500 mt-2 font-medium ml-1">高精视觉大模型驱动，科研图表数据全自动解析与对齐系统</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="clearAllBtn" class="px-5 py-2.5 text-sm font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl transition-all duration-200 flex items-center gap-2">
          <i class="fa-solid fa-fire-burner"></i> 清除全部数据
        </button>
      </div>
    </div>

    <!-- API 配置与手动指定指标输入框 -->
    <div class="bg-white p-7 rounded-3xl shadow-xl shadow-slate-200/30 border border-slate-100 space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-500"></i> AI 引擎与提取规则配置
        </h2>
        <div class="flex flex-wrap gap-2 p-1 bg-slate-50 rounded-xl border border-slate-200">
          <button type="button" onclick="setPreset('gemini')" class="px-4 py-1.5 text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">Gemini</button>
          <button type="button" onclick="setPreset('zhipu')" class="px-4 py-1.5 text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">GLM-4V</button>
          <button type="button" onclick="setPreset('qwen-max')" class="px-4 py-1.5 text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">Qwen Max</button>
          <button type="button" onclick="setPreset('siliconflow')" class="px-4 py-1.5 text-xs bg-white text-slate-700 hover:text-indigo-600 shadow-sm rounded-lg transition-all font-semibold">SiliconFlow</button>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Base URL</label>
          <input type="text" id="apiBaseUrl" class="w-full text-sm bg-slate-50 px-4 py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Vision Model</label>
          <input type="text" id="apiModel" class="w-full text-sm bg-indigo-50/50 px-4 py-2.5 border border-indigo-100 rounded-xl input-glow outline-none transition-all font-bold text-indigo-700 font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">API Key</label>
          <input type="password" id="apiKey" class="w-full text-sm bg-slate-50 px-4 py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
      </div>

      <div class="pt-5 border-t border-slate-100">
        <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center justify-between">
          <span>🎯 提取目标白名单 <span class="text-slate-400 font-normal text-xs ml-2">（AI 将严格按此列表从图片抓取数据并作为表头）</span></span>
          <button type="button" onclick="resetDefaultHeaders()" class="text-indigo-500 hover:text-indigo-700 transition-colors text-xs font-medium bg-indigo-50 px-3 py-1 rounded-md">恢复默认 PAM 指标</button>
        </label>
        <textarea id="targetHeadersInput" rows="2" class="w-full text-sm font-mono leading-relaxed px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700" placeholder="例如: protocol_id, Leaf Temperature, Leaf Temperature Differenial, Light Intensity PAR..."></textarea>
      </div>
    </div>

    <!-- 工作区 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 relative">
      <!-- 左侧：上传区与队列 -->
      <div class="space-y-6 flex flex-col lg:sticky lg:top-[120px] lg:h-[calc(100vh-140px)] lg:self-start lg:col-span-1">
        
        <!-- 大按钮式上传区 -->
        <div id="clickUploadZone" class="bg-gradient-to-b from-indigo-50 to-white border-2 border-dashed border-indigo-200 hover:border-indigo-400 transition-all duration-300 py-8 rounded-3xl flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group shadow-sm hover:shadow-md hover:shadow-indigo-500/10">
          <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
          <div class="w-14 h-14 bg-white text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-4 shadow-md shadow-slate-200 border border-slate-100 transition-transform duration-300 group-hover:-translate-y-1 group-hover:scale-110">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
          </div>
          <h3 class="font-bold text-slate-700 text-base mb-1">导入图表文件</h3>
          <p class="text-slate-400 text-xs font-medium px-4">点击浏览或拖拽图片到任意位置</p>
        </div>

        <!-- 队列列表 -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/30 p-5 flex flex-col flex-1 min-h-[300px] overflow-hidden">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100 shrink-0">
            <span class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-slate-400"></i> 解析任务列队
            </span>
            <span id="fileCountBadge" class="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full tracking-wider">0 项</span>
          </div>
          <div id="fileList" class="divide-y divide-slate-50 flex-1 overflow-y-auto mt-2 pb-2 pr-2 -mr-2 space-y-1">
            <div id="emptyListTip" class="h-full flex flex-col items-center justify-center text-slate-300 gap-3 opacity-60">
              <i class="fa-regular fa-folder-open text-4xl"></i>
              <p class="text-xs font-medium">暂无待处理文件</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧：数据表格区 -->
      <div class="lg:col-span-3 h-[calc(100vh-140px)]">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/40 p-6 flex flex-col h-full relative overflow-hidden">
          
          <!-- 表格头部操作区 -->
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-5 shrink-0">
            <div>
              <h2 class="font-extrabold text-slate-800 text-xl tracking-tight">结构化数据矩阵</h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">已自动去重并对齐。点击任何单元格即可无缝修改。</p>
            </div>
            <button id="exportCsvBtn" disabled class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all duration-300 hover:shadow-emerald-500/40 hover:-translate-y-0.5 flex items-center gap-2 shrink-0 border border-emerald-400/50">
              <i class="fa-solid fa-download"></i> 导出 CSV 数据
            </button>
          </div>

          <!-- 表格核心渲染区 -->
          <div class="flex-1 overflow-auto rounded-2xl border border-slate-200/60 bg-slate-50/30 relative" id="tableWrapper">
            <!-- 占位状态 -->
            <div id="tablePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-white/50 backdrop-blur-sm transition-opacity">
              <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mb-4">
                <i class="fa-solid fa-table-list text-3xl text-slate-300"></i>
              </div>
              <p class="text-sm font-medium">数据表将在此处生成</p>
            </div>
            
            <!-- 表格本体 -->
            <table id="dataTable" class="w-full text-xs text-left border-collapse hidden relative">
              <thead id="tableHead" class="bg-slate-100/80 backdrop-blur-md text-slate-600 sticky top-0 z-20 shadow-sm"></thead>
              <tbody id="tableBody" class="divide-y divide-slate-100 font-mono text-slate-700 bg-white"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 以下为 JS 逻辑代码，保持绝对纯净，未作任何功能删减
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    const DB_NAME = 'ImageCacheDB_Manual_Final';
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains('images')) {
            const store = db.createObjectStore('images', { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
          }
        };
        request.onsuccess = (event) => {
          db = event.target.result;
          resolve();
        };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function saveImageToCache(id, base64Data) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.put({ id: id, data: base64Data, timestamp: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageFromCache(id) {
      if (!db) return null;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const store = tx.objectStore('images');
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.data : null);
        request.onerror = () => reject(request.error);
      });
    }

    async function pruneImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        const index = store.index('timestamp');
        const countReq = store.count();
        countReq.onsuccess = () => {
          if (countReq.result > 50) {
            let toDelete = countReq.result - 50;
            index.openCursor().onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor && toDelete > 0) {
                cursor.delete();
                toDelete--;
                cursor.continue();
              } else {
                resolve();
              }
            };
          } else {
            resolve();
          }
        };
      });
    }

    async function clearImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.clear().onsuccess = resolve;
      });
    }

    let filesState = []; 
    let allColumns = ["样本名称"];
    let isProcessing = false;

    // 默认 PAM 常用指标库
    const DEFAULT_HEADERS = [
      "protocol_id", "Ambient Humidity", "Ambient Pressure", "Ambient Temperature", 
      "Chamber Temperature", "ECS_tau", "ECSt mAU", "FmPrime", "FoPrime", "Fs", 
      "Fv over FmP", "LEF", "Leaf Temperature", "Leaf Temperature Differenial", 
      "Light Intensity PAR", "NPQt", "P700 DIRK ampl", "PS1 Active Centers", 
      "PS1 Open Centers", "PS1 Over Reduced Centers", "PS1 Oxidized Centers", 
      "Phi2", "PhiNO", "PhiNPQ", "SPAD", "gH+", "kP700", "leaf angle", 
      "leaf_thickness", "pump", "qL", "tP700", "test_data_raw_PAM", "vH+", "v_initial_P700"
    ];

    const clickUploadZone = document.getElementById('clickUploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyListTip = document.getElementById('emptyListTip');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const tablePlaceholder = document.getElementById('tablePlaceholder');
    const dataTable = document.getElementById('dataTable');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const targetHeadersInput = document.getElementById('targetHeadersInput');

    function setPreset(type) {
      if (type === 'gemini') {
        document.getElementById('apiBaseUrl').value = 'https://generativelanguage.googleapis.com/v1beta/openai';
        document.getElementById('apiModel').value = 'gemini-1.5-flash';
      } else if (type === 'zhipu') {
        document.getElementById('apiBaseUrl').value = 'https://open.bigmodel.cn/api/paas/v4';
        document.getElementById('apiModel').value = 'glm-4v-flash';
      } else if (type === 'qwen-max') {
        document.getElementById('apiBaseUrl').value = 'https://dashscope.aliyuncs.com/compatible-mode/v1';
        document.getElementById('apiModel').value = 'qwen-vl-max';
      } else if (type === 'siliconflow') {
        document.getElementById('apiBaseUrl').value = 'https://api.siliconflow.cn/v1';
        document.getElementById('apiModel').value = 'Qwen/Qwen2-VL-7B-Instruct';
      }
      saveApiSettings();
    }

    function resetDefaultHeaders() {
      targetHeadersInput.value = DEFAULT_HEADERS.join(', ');
      saveApiSettings();
    }

    function loadApiSettings() {
      document.getElementById('apiBaseUrl').value = localStorage.getItem('api_base_url') || 'https://generativelanguage.googleapis.com/v1beta/openai';
      document.getElementById('apiModel').value = localStorage.getItem('api_model') || 'gemini-1.5-flash';
      document.getElementById('apiKey').value = localStorage.getItem('api_key') || '';
      
      const savedHeaders = localStorage.getItem('user_target_headers_final');
      targetHeadersInput.value = savedHeaders || DEFAULT_HEADERS.join(', ');
      
      updateColumnsFromInput();
    }

    function saveApiSettings() {
      localStorage.setItem('api_base_url', document.getElementById('apiBaseUrl').value.trim());
      localStorage.setItem('api_model', document.getElementById('apiModel').value.trim());
      localStorage.setItem('api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('user_target_headers_final', targetHeadersInput.value.trim());
      updateColumnsFromInput();
    }

    function updateColumnsFromInput() {
      const raw = targetHeadersInput.value.split(',');
      const parsed = raw.map(h => h.trim()).filter(Boolean);
      if (parsed.length > 0) {
        allColumns = ["样本名称", ...parsed];
        renderTable();
      }
    }

    targetHeadersInput.addEventListener('input', saveApiSettings);
    ['apiBaseUrl', 'apiModel', 'apiKey'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveApiSettings);
    });

    function saveTableData() {
      const stateToSave = filesState.map(f => ({
        id: f.id, customName: f.customName, status: f.status, data: f.data, errorMsg: f.errorMsg
      }));
      localStorage.setItem('extracted_data_state_manual_final', JSON.stringify(stateToSave));
    }

    function loadTableData() {
      const savedState = localStorage.getItem('extracted_data_state_manual_final');
      if (savedState) {
        filesState = JSON.parse(savedState);
        if (filesState.length > 0) {
          emptyListTip.classList.add('hidden');
          filesState.forEach(item => {
            if (item.status === 'processing') item.status = 'pending';
            renderQueueItemDOM(item);
          });
          renderTable();
          updateUI();
          if (filesState.some(f => f.status === 'pending') && !isProcessing) {
              processQueue();
          }
        }
      }
    }

    const globalDropZone = document.getElementById('globalDropZone');
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        globalDropZone.classList.add('flex');
        globalDropZone.classList.remove('hidden');
      }
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        globalDropZone.classList.add('hidden');
        globalDropZone.classList.remove('flex');
      }
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      globalDropZone.classList.add('hidden');
      globalDropZone.classList.remove('flex');
      if (e.dataTransfer.files.length) handleNewFiles(e.dataTransfer.files);
    });

    clickUploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleNewFiles(e.target.files);
      fileInput.value = '';
    });

    async function handleNewFiles(files) {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { alert('请先在上方填入 API 密钥！'); return; }
      
      for (const file of Array.from(files)) {
        if (!file.type.startsWith('image/')) continue;
        const fileId = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const item = { id: fileId, customName: file.name.replace(/\.[^/.]+$/, ""), status: 'pending', data: null, file: file, errorMsg: '' };
        filesState.push(item);
        renderQueueItemDOM(item);
        setTimeout(() => fileList.scrollTop = fileList.scrollHeight, 50);
      }
      saveTableData();
      updateUI();
      if (!isProcessing) processQueue();
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_SIZE = 1200;
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function getTargetHeaders() {
      const raw = targetHeadersInput.value.split(',');
      return raw.map(h => h.trim()).filter(Boolean);
    }

    function mapKeyToTarget(rawKey, targets) {
      let key = (rawKey || '').trim();
      let lower = key.toLowerCase().replace(/[_]+/g, ' ').replace(/\s+/g, ' ');

      if (lower.includes('leaf temperature differen') || lower.includes('differential')) {
        for (const t of targets) {
          if (t.toLowerCase().includes('differen')) return t;
        }
        return 'Leaf Temperature Differenial';
      }

      for (const t of targets) {
        let tLower = t.toLowerCase();
        if (lower === tLower || lower.includes(tLower) || tLower.includes(lower)) return t;
      }
      return key;
    }

    async function processQueue() {
      isProcessing = true;
      while (true) {
        const pendingItem = filesState.find(f => f.status === 'pending');
        if (!pendingItem) break;
        
        pendingItem.status = 'processing';
        updateQueueItemUI(pendingItem);
        
        try {
          let base64 = await getImageFromCache(pendingItem.id);
          
          if (!base64) {
            if (pendingItem.file) {
              base64 = await compressImageToBase64(pendingItem.file);
              await saveImageToCache(pendingItem.id, base64);
              await pruneImageCache();
            } else {
              throw new Error('原图缓存已过期，请再次拖入图片（部署后跨域无法提取本地图片）');
            }
          }

          const rawEntries = await callVisionApiEntries(base64);
          const targets = getTargetHeaders();
          const alignedData = {};

          rawEntries.forEach(([k, val]) => {
            const standardKey = mapKeyToTarget(k, targets);
            const strVal = (val !== undefined && val !== null) ? String(val).trim() : '';

            if (strVal && strVal !== '-' && (alignedData[standardKey] === undefined || alignedData[standardKey] === '-' || alignedData[standardKey] === '')) {
              alignedData[standardKey] = strVal;
            } else if (alignedData[standardKey] === undefined) {
              alignedData[standardKey] = strVal;
            }
            
            if (!allColumns.includes(standardKey) && standardKey !== "样本名称") {
              allColumns.push(standardKey);
            }
          });

          pendingItem.status = 'success';
          pendingItem.data = alignedData;

        } catch (err) {
          pendingItem.status = 'error';
          pendingItem.errorMsg = err.message || '识别失败';
        }
        
        updateQueueItemUI(pendingItem);
        renderTable();
        updateUI();
        saveTableData();
        
        setTimeout(() => {
          const wrapper = document.getElementById('tableWrapper');
          wrapper.scrollTop = wrapper.scrollHeight;
        }, 50);

        await sleep(1000);
      }
      isProcessing = false;
    }

    async function callVisionApiEntries(base64Url) {
      let baseUrl = document.getElementById('apiBaseUrl').value.trim().replace(/\/+$/, '');
      const model = document.getElementById('apiModel').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim().replace(/[\u4e00-\u9fa5\s]/g, '');

      if (!baseUrl.endsWith('/chat/completions')) baseUrl += '/chat/completions';

      const targets = getTargetHeaders();

      const systemPrompt = `你是一个精密的科学仪器屏幕数据提取助手。请仔细观察图片，重点提取以下【用户指定的指标列表】中的数值：
[${targets.join(', ')}]

【⚠️ 温差字段特殊提醒】：
图片中包含有 "Leaf Temperature Differenial"（温差行，屏幕拼写可能为 Differenial 或 Differential），绝对不能漏掉！必须将其数值准确提取出来。

规则：
1. 请从上到下完整扫描图片每一行，将上述列表中的指标完整提取出来。
2. 请以 JSON 数组对象形式返回，格式如：
[
  {"key": "protocol_id", "value": "3357"},
  {"key": "Leaf Temperature Differenial", "value": "-5.35"}
]
3. 严禁省略中间的数据，不允许出现 "..."。只返回纯 JSON 数组，不要有多余的 markdown 标记。`;

      const response = await fetch(baseUrl, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'Authorization': `Bearer ${apiKey}` 
        },
        body: JSON.stringify({
          model: model,
          temperature: 0.01,
          messages: [
            { 
              role: "user", 
              content: [ 
                { type: "text", text: systemPrompt }, 
                { type: "image_url", image_url: { url: base64Url } } 
              ] 
            }
          ]
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        let errMsg = errJson.error?.message || `请求被拒绝 [HTTP ${response.status}]`;
        if (response.status === 404) errMsg = `[404] 模型 ${model} 不存在或地址有误`;
        if (response.status === 401) errMsg = `[401] 密钥无效`;
        if (response.status === 403) errMsg = `[403] 权限拒绝(请检查额度/模型权限)`;
        throw new Error(errMsg);
      }

      const res = await response.json();
      let rawText = res.choices?.[0]?.message?.content || '[]';
      
      const match = rawText.match(/\[[\s\S]*\]/);
      if (match) rawText = match[0];
      else throw new Error("AI 返回格式异常，未能提取到 JSON 数组数据");
      
      const parsedArray = JSON.parse(rawText);
      return parsedArray.map(item => [item.key, item.value]);
    }

    function renderQueueItemDOM(item) {
      emptyListTip.classList.add('hidden');
      const div = document.createElement('div');
      div.id = `queue_${item.id}`;
      // 添加了悬停背景和淡入特效
      div.className = 'py-3 px-3 rounded-xl transition-all duration-200 flex items-center justify-between gap-3 group/item hover:bg-slate-50 border border-transparent hover:border-slate-100 fade-in-row mt-1';
      div.innerHTML = `
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-400 flex items-center justify-center shrink-0">
            <i class="fa-regular fa-image text-xs"></i>
          </div>
          <input type="text" value="${escapeHtml(item.customName)}" title="修改样本名称" 
                 class="name-input text-xs font-bold text-slate-700 bg-transparent hover:bg-white focus:bg-white px-2 py-1.5 border border-transparent focus:border-indigo-400 rounded-md outline-none truncate w-full transition-all focus:ring-2 focus:ring-indigo-100"
                 onchange="updateItemName('${item.id}', this.value)">
        </div>
        <div class="status-box text-xs flex items-center gap-2 shrink-0 font-medium"></div>
      `;
      fileList.appendChild(div);
      updateQueueItemUI(item);
    }

    function updateQueueItemUI(item) {
      const el = document.getElementById(`queue_${item.id}`);
      if (!el) return;
      const statusBox = el.querySelector('.status-box');
      const deleteBtn = `<button onclick="deleteRowItem('${item.id}')" title="删除记录" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-trash-can"></i></button>`;

      if (item.status === 'pending') {
        statusBox.innerHTML = `<span class="text-slate-400 flex items-center gap-1.5"><i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> 排队中</span> ${deleteBtn}`;
      } else if (item.status === 'processing') {
        statusBox.innerHTML = `<span class="text-indigo-600 flex items-center gap-1.5 bg-indigo-50 px-2 py-1 rounded-md"><i class="fa-solid fa-microscope text-indigo-500 animate-pulse"></i> 提取中</span>`;
      } else if (item.status === 'success') {
        statusBox.innerHTML = `
          <button onclick="retryItem('${item.id}')" title="重新识别" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 px-2 py-1 rounded transition-all text-[10px] mr-1 font-semibold flex items-center gap-1 opacity-0 group-hover/item:opacity-100"><i class="fa-solid fa-rotate-right"></i> 重试</button>
          <span class="text-emerald-600 flex items-center gap-1.5 bg-emerald-50 px-2 py-1 rounded-md"><i class="fa-solid fa-check text-emerald-500"></i> 成功</span> 
          ${deleteBtn}`;
      } else if (item.status === 'error') {
        statusBox.innerHTML = `<button onclick="retryItem('${item.id}')" class="text-indigo-600 hover:text-white hover:bg-indigo-500 border border-indigo-200 px-2 py-1 rounded transition-all mr-1 shadow-sm">重试</button>
                               <div class="relative group/tooltip">
                                 <span class="text-rose-600 flex items-center gap-1.5 cursor-help bg-rose-50 px-2 py-1 rounded-md"><i class="fa-solid fa-triangle-exclamation"></i> 失败</span>
                                 <div class="absolute right-0 bottom-full mb-2 hidden group-hover/tooltip:block w-56 p-2.5 bg-slate-800 text-white text-[11px] leading-relaxed rounded-lg shadow-xl z-50 break-words font-normal">${escapeHtml(item.errorMsg)}</div>
                               </div>
                               ${deleteBtn}`;
      }
    }

    window.retryItem = async function(id) {
      const item = filesState.find(f => f.id === id);
      if (item) {
        item.status = 'pending'; 
        item.errorMsg = '';
        updateQueueItemUI(item); 
        saveTableData();
        if (!isProcessing) processQueue();
      }
    };

    window.deleteRowItem = async function(id) {
      filesState = filesState.filter(f => f.id !== id);
      const el = document.getElementById(`queue_${id}`);
      if (el) el.remove();
      if (filesState.length === 0) emptyListTip.classList.remove('hidden');
      renderTable(); updateUI(); saveTableData();
      
      if (db) {
         const tx = db.transaction('images', 'readwrite');
         tx.objectStore('images').delete(id);
      }
    };

    window.deleteColumn = function(colName) {
      if (confirm(`确定要删除整列【${colName}】吗？`)) {
        allColumns = allColumns.filter(c => c !== colName);
        filesState.forEach(item => { if (item.data && item.data[colName] !== undefined) delete item.data[colName]; });
        renderTable(); saveTableData();
      }
    };

    window.updateItemName = function(id, newName) {
      const item = filesState.find(f => f.id === id);
      if (item) {
        item.customName = newName.trim() || item.customName;
        const leftInput = document.querySelector(`#queue_${id} .name-input`);
        if (leftInput) leftInput.value = item.customName;
        renderTable(); saveTableData();
      }
    };

    window.updateCellValue = function(id, col, newValue) {
      const item = filesState.find(f => f.id === id);
      if (item && item.data) { item.data[col] = newValue.trim(); saveTableData(); }
    };

    function renderTable() {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (successfulItems.length === 0) {
        tablePlaceholder.classList.remove('hidden'); dataTable.classList.add('hidden'); return;
      }
      tablePlaceholder.classList.add('hidden'); dataTable.classList.remove('hidden');

      // 优化表头 UI：增加透明模糊度与更精致的排版
      tableHead.innerHTML = `<tr>${allColumns.map(col => {
        if (col === "样本名称") return `<th class="px-4 py-3.5 font-bold text-slate-700 whitespace-nowrap bg-slate-100/90 backdrop-blur-sm border-b border-slate-200 z-30 tracking-wide text-xs"><span>${escapeHtml(col)}</span></th>`;
        return `<th class="px-4 py-3.5 font-bold text-slate-700 whitespace-nowrap bg-slate-100/90 backdrop-blur-sm border-b border-slate-200 group/th min-w-[130px] z-30 tracking-wide text-xs">
          <div class="flex items-center justify-between gap-3">
            <span>${escapeHtml(col)}</span>
            <button onclick="deleteColumn('${escapeHtml(col).replace(/'/g, "\\'")}')" class="w-5 h-5 flex items-center justify-center rounded text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/th:opacity-100"><i class="fa-solid fa-xmark text-[10px]"></i></button>
          </div>
        </th>`;
      }).join('')}<th class="px-4 py-3.5 font-bold text-slate-400 whitespace-nowrap bg-slate-100/90 backdrop-blur-sm border-b border-slate-200 text-center sticky right-0 z-40 w-14 shadow-[-8px_0_12px_-4px_rgba(0,0,0,0.03)] text-xs">操作</th></tr>`;

      // 优化表格行 UI：带有淡入动画和悬停高亮，输入框无边界设计
      tableBody.innerHTML = successfulItems.map(item => {
        return `<tr class="hover:bg-indigo-50/30 transition-colors fade-in-row group/tr">
          ${allColumns.map(col => {
            if (col === "样本名称") return `<td class="px-2 py-1 font-sans font-bold text-slate-800 border-b border-slate-100 whitespace-nowrap bg-white/40"><input type="text" value="${escapeHtml(item.customName)}" class="bg-transparent hover:bg-white focus:bg-white px-2 py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-lg outline-none transition-all w-full" onchange="updateItemName('${item.id}', this.value)"></td>`;
            const val = item.data[col] !== undefined ? item.data[col] : '';
            return `<td class="px-2 py-1 border-b border-slate-100 whitespace-nowrap group-hover/tr:bg-white/40 transition-colors"><input type="text" value="${escapeHtml(val)}" class="text-slate-600 bg-transparent hover:bg-slate-50 focus:bg-white px-2 py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-lg outline-none transition-all w-full placeholder:text-slate-200" placeholder="-" onchange="updateCellValue('${item.id}', '${escapeHtml(col).replace(/'/g, "\\'")}', this.value)"></td>`;
          }).join('')}<td class="px-2 py-1 border-b border-slate-100 whitespace-nowrap text-center bg-white/40 sticky right-0 z-10 shadow-[-8px_0_12px_-4px_rgba(0,0,0,0.02)] group-hover/tr:bg-indigo-50/30 transition-colors"><button onclick="deleteRowItem('${item.id}')" class="w-7 h-7 mx-auto flex items-center justify-center rounded-md text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/tr:opacity-100"><i class="fa-solid fa-trash-can text-[11px]"></i></button></td></tr>`;
      }).join('');
    }

    exportCsvBtn.addEventListener('click', () => {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (!successfulItems.length) return;
      const headerLine = allColumns.map(c => `"${c.replace(/"/g, '""')}"`).join(',');
      const rowLines = successfulItems.map(item => {
        return allColumns.map(col => `"${String(col === "样本名称" ? item.customName : (item.data[col] !== undefined ? item.data[col] : "")).replace(/"/g, '""')}"`).join(',');
      });
      const blob = new Blob(["\uFEFF" + [headerLine, ...rowLines].join("\r\n")], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `科学数据提取结果_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });

    clearAllBtn.addEventListener('click', async () => {
      if (!filesState.length) return;
      if (confirm('是否确定清空当前工作区的所有数据和图片缓存？\n\n注意：此操作不可恢复。')) {
        filesState = []; 
        updateColumnsFromInput();
        fileList.innerHTML = ''; 
        fileList.appendChild(emptyListTip);
        emptyListTip.classList.remove('hidden'); 
        renderTable(); 
        updateUI();
        localStorage.removeItem('extracted_data_state_manual_final');
        await clearImageCache();
      }
    });

    function updateUI() {
      fileCountBadge.innerText = `${filesState.length} 项`;
      exportCsvBtn.disabled = !filesState.some(f => f.status === 'success');
    }

    // 强力安全启动层
    (async function initApp() {
      loadApiSettings();
      try {
        await initDB();
      } catch (e) {
        console.warn("⚠️ 警告：无法启动本地图片数据库！如果处于无痕模式或微信内置浏览器，刷新后原图记忆会丢失。", e);
      }
      try {
        loadTableData();
      } catch (e) {
        console.error("加载记忆数据失败", e);
      }
    })();
  </script>
</body>
</html>
