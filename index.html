<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多功能仪器数据提取工作站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 引入专业的 Excel 导出库 SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    ::-webkit-scrollbar { height: 6px; width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .fade-in-row { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      border-color: #818cf8;
      background-color: #fff;
    }

    /* 全局双向高光联动追踪样式 */
    .pair-hover {
      background-color: #eef2ff !important;
      box-shadow: inset 0 0 0 1px #818cf8 !important;
      transition: all 0.15s ease-in-out;
      border-radius: 0.25rem;
    }
    td.pair-hover { border-radius: 0; }
    tr.pair-hover td:first-child { border-top-left-radius: 0.5rem; border-bottom-left-radius: 0.5rem; }
    tr.pair-hover td:last-child { border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
  </style>
</head>
<body class="bg-slate-50/50 text-slate-800 min-h-screen p-2 sm:p-4 md:p-8 relative selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">
  
  <!-- 原图高清预览遮罩层 -->
  <div id="imagePreviewModal" class="fixed inset-0 z-[200] hidden flex-col items-center justify-center bg-slate-900/90 backdrop-blur-md p-4 sm:p-8 transition-opacity" onclick="this.classList.add('hidden'); this.classList.remove('flex');">
    <button class="absolute top-4 right-4 sm:top-6 sm:right-8 text-white/60 hover:text-white text-3xl sm:text-4xl focus:outline-none transition-colors"><i class="fa-solid fa-xmark"></i></button>
    <img id="previewImg" src="" class="max-w-full max-h-full rounded-xl shadow-2xl object-contain border-4 border-white/10" onclick="event.stopPropagation()">
  </div>

  <div id="globalDropZone" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-white/90 backdrop-blur-md border-[8px] sm:border-[12px] border-indigo-500/20 m-2 sm:m-4 rounded-[2rem] transition-all duration-300">
    <div class="pointer-events-none flex flex-col items-center scale-90 sm:scale-110">
      <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-full flex items-center justify-center shadow-2xl shadow-indigo-500/40 mb-6 animate-bounce">
        <i class="fa-solid fa-cloud-arrow-up text-4xl sm:text-5xl text-white"></i>
      </div>
      <h2 class="text-3xl sm:text-4xl font-bold mb-3 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-violet-700">松开，开始识别</h2>
    </div>
  </div>

  <div class="max-w-[1500px] mx-auto space-y-4 sm:space-y-6 md:space-y-8">
    
    <!-- 顶部标题栏 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white/80 backdrop-blur-xl p-4 sm:p-6 md:px-8 md:py-6 rounded-2xl md:rounded-3xl shadow-lg shadow-slate-200/40 border border-white relative transition-all">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-2 sm:gap-3 tracking-tight flex-wrap">
          <span class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white shrink-0">
            <i class="fa-solid fa-microscope text-[14px] sm:text-[18px]"></i>
          </span>
          <span id="header-title" class="bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">光合仪</span> 
          <span class="text-slate-800">数据提取</span>
          <span class="text-[10px] sm:text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full font-semibold border border-indigo-100">26.9.19最新版</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-2 font-medium sm:ml-1 leading-relaxed">光合仪与氮平衡仪一键切换，科研数据全自动解析对齐。</p>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <button id="clearAllBtn" class="w-full sm:w-auto px-4 sm:px-5 py-2 sm:py-2.5 text-xs sm:text-sm font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl transition-all duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-fire-burner"></i> 清空当前区数据
        </button>
      </div>
    </div>

    <!-- API 配置与手动指定指标输入框 -->
    <div class="bg-white p-4 sm:p-5 md:p-7 rounded-2xl md:rounded-3xl shadow-lg shadow-slate-200/30 border border-slate-100 space-y-5 sm:space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4">
        <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-500"></i> AI 引擎与提取配置
        </h2>
        <div class="flex flex-wrap gap-1.5 sm:gap-2 p-1 bg-slate-50 rounded-xl border border-slate-200 overflow-x-auto whitespace-nowrap scrollbar-hide">
          <button type="button" onclick="setPreset('zhipu')" class="px-3 sm:px-4 py-1.5 text-[11px] sm:text-xs bg-indigo-50 text-indigo-700 shadow-sm rounded-lg transition-all font-bold border border-indigo-100">
            <i class="fa-solid fa-bolt text-indigo-500 mr-1"></i> 智谱 GLM-4V
          </button>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-5">
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">接口地址 (Base URL)</label>
          <input type="text" id="apiBaseUrl" class="w-full text-xs sm:text-sm bg-slate-50 px-3 sm:px-4 py-2 sm:py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">视觉模型 (Model)</label>
          <input type="text" id="apiModel" class="w-full text-xs sm:text-sm bg-indigo-50/50 px-3 sm:px-4 py-2 sm:py-2.5 border border-indigo-100 rounded-xl input-glow outline-none transition-all font-bold text-indigo-700 font-mono">
        </div>
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-slate-500 mb-1 sm:mb-1.5 uppercase tracking-wider">API 密钥 (API Key)</label>
          <input type="password" id="apiKey" class="w-full text-xs sm:text-sm bg-slate-50 px-3 sm:px-4 py-2 sm:py-2.5 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700 font-mono">
        </div>
      </div>

      <div class="pt-4 sm:pt-5 border-t border-slate-100">
        <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <span>🎯 提取指标名称 <span class="text-slate-400 font-normal text-[10px] sm:text-xs sm:ml-2">（AI 将严格按此列表抓取数据）</span></span>
          
          <div class="flex items-center gap-2 self-start sm:self-auto bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="btn-PAM" type="button" onclick="setInstrument('PAM')" class="text-indigo-700 font-bold bg-white px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 shadow-sm transition-all text-[10px] sm:text-xs">
              <i class="fa-brands fa-pagelines"></i> 🌿 光合仪区
            </button>
            <button id="btn-NBI" type="button" onclick="setInstrument('NBI')" class="text-slate-500 hover:text-emerald-700 font-medium bg-transparent px-3 py-1.5 rounded-lg border border-transparent flex items-center gap-1.5 transition-all text-[10px] sm:text-xs">
              <i class="fa-solid fa-leaf"></i> 🌱 氮平衡仪区
            </button>
          </div>
        </label>
        <textarea id="targetHeadersInput" rows="3" class="w-full text-[11px] sm:text-sm font-mono leading-relaxed px-3 sm:px-4 py-2 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl input-glow outline-none transition-all text-slate-700" placeholder="点击右上角按钮快速载入，或手动输入（逗号隔开）..."></textarea>
      </div>
    </div>

    <!-- 左侧上传与右侧表格布局 -->
    <div class="flex flex-col lg:flex-row gap-4 sm:gap-6 lg:gap-8 relative">
      
      <!-- 左侧面板：定宽保障长文本不会溢出 -->
      <div class="space-y-4 sm:space-y-6 flex flex-col w-full lg:w-[320px] xl:w-[380px] shrink-0 lg:sticky lg:top-[20px] lg:h-[calc(100vh-40px)] lg:self-start">
        
        <div id="clickUploadZone" class="bg-gradient-to-b from-indigo-50 to-white border-2 border-dashed border-indigo-200 hover:border-indigo-400 transition-all duration-300 py-6 sm:py-8 rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center text-center cursor-pointer relative overflow-hidden group shadow-sm hover:shadow-md hover:shadow-indigo-500/10 active:scale-[0.98]">
          <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white text-indigo-600 rounded-2xl flex items-center justify-center text-xl sm:text-2xl mb-3 sm:mb-4 shadow-md shadow-slate-200 border border-slate-100 transition-transform duration-300 group-hover:-translate-y-1 group-hover:scale-110">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
          </div>
          <h3 class="font-bold text-slate-700 text-sm sm:text-base mb-1">导入图表文件</h3>
          <p class="text-slate-400 text-[10px] sm:text-xs font-medium px-4">支持批量队列及 4K 原图解析</p>
        </div>

        <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-lg shadow-slate-200/30 p-4 sm:p-5 flex flex-col flex-1 min-h-[200px] max-h-[40vh] lg:max-h-none lg:min-h-[300px] overflow-hidden">
          <div class="flex items-center justify-between pb-3 sm:pb-4 border-b border-slate-100 shrink-0">
            <span class="text-xs sm:text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-slate-400"></i> 解析列队
            </span>
            <span id="fileCountBadge" class="text-[9px] sm:text-[10px] font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 bg-slate-100 text-slate-600 rounded-full tracking-wider">0 项</span>
          </div>
          <div id="fileList" class="divide-y divide-slate-50 flex-1 overflow-y-auto mt-2 pb-2 pr-1 space-y-1">
            <div id="emptyListTip" class="h-full flex flex-col items-center justify-center text-slate-300 gap-2 sm:gap-3 opacity-60 py-4">
              <i class="fa-regular fa-folder-open text-3xl sm:text-4xl"></i>
              <p class="text-[10px] sm:text-xs font-medium">暂无待处理文件</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧：数据表格区 -->
      <div class="flex-1 min-w-0 flex flex-col min-h-[500px] h-[60vh] lg:h-[calc(100vh-40px)]">
        <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-lg shadow-slate-200/40 p-4 sm:p-6 flex flex-col h-full relative overflow-hidden">
          
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4 mb-4 sm:mb-5 shrink-0">
            <div>
              <h2 class="font-extrabold text-slate-800 text-lg sm:text-xl tracking-tight">结构化数据表格</h2>
              <p class="text-[10px] sm:text-xs text-slate-500 mt-1 font-medium">悬停任意行可触发全局高光追踪，点击队列缩略图可查看大图。</p>
            </div>
            <button id="exportCsvBtn" disabled class="w-full sm:w-auto px-4 sm:px-5 py-2 sm:py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs sm:text-sm font-bold rounded-xl shadow-md shadow-emerald-500/20 transition-all duration-300 hover:shadow-emerald-500/40 sm:hover:-translate-y-0.5 flex items-center justify-center gap-2 shrink-0 border border-emerald-400/50">
              <i class="fa-regular fa-file-excel"></i> 导出 Excel (XLSX)
            </button>
          </div>

          <div class="flex-1 overflow-auto rounded-xl sm:rounded-2xl border border-slate-200/60 bg-slate-50/30 relative shadow-inner" id="tableWrapper">
            <div id="tablePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-white/50 backdrop-blur-sm transition-opacity">
              <div class="w-12 h-12 sm:w-16 sm:h-16 bg-slate-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-3 sm:mb-4">
                <i class="fa-solid fa-table-list text-2xl sm:text-3xl text-slate-300"></i>
              </div>
              <p class="text-xs sm:text-sm font-medium">数据表将在此处生成</p>
            </div>
            
            <table id="dataTable" class="w-full text-[10px] sm:text-xs text-center border-collapse hidden relative select-none">
              <thead id="tableHead" class="bg-slate-100/95 backdrop-blur-md text-slate-600 sticky top-0 z-20 shadow-sm border-b-2 border-slate-200"></thead>
              <tbody id="tableBody" class="divide-y divide-slate-100 font-mono text-slate-700 bg-white relative"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    const DB_NAME = 'ImageCacheDB_Precision_Final';
    const DB_VERSION = 1;
    let db;

    let currentMode = localStorage.getItem('active_instrument_mode') || 'PAM';

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains('images')) {
            const store = db.createObjectStore('images', { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
          }
        };
        request.onsuccess = (event) => {
          db = event.target.result;
          resolve();
        };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function saveImageToCache(id, base64Data) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.put({ id: id, data: base64Data, timestamp: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageFromCache(id) {
      if (!db) return null;
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const store = tx.objectStore('images');
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.data : null);
        request.onerror = () => reject(request.error);
      });
    }

    async function pruneImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        const index = store.index('timestamp');
        const countReq = store.count();
        countReq.onsuccess = () => {
          if (countReq.result > 150) {
            let toDelete = countReq.result - 100;
            index.openCursor().onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor && toDelete > 0) {
                cursor.delete();
                toDelete--;
                cursor.continue();
              } else {
                resolve();
              }
            };
          } else {
            resolve();
          }
        };
      });
    }

    async function clearImageCache() {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        const store = tx.objectStore('images');
        store.clear().onsuccess = resolve;
      });
    }

    let filesState = []; 
    let allColumns = ["样本名称"];
    let isProcessing = false;

    // 🌟 恢复了 Chamber Temperature，回归完整的光合仪指标体系
    const PAM_HEADERS = "protocol_id, Ambient Humidity, Ambient Pressure, Ambient Temperature, Chamber Temperature, ECS_tau, ECSt mAU, FmPrime, FoPrime, Fs, Fv over FmP, LEF, Leaf Temperature, Leaf Temperature Differenial, Light Intensity PAR, NPQt, P700 DIRK ampl, PS1 Active Centers, PS1 Open Centers, PS1 Over Reduced Centers, PS1 Oxidized Centers, Phi2, PhiNO, PhiNPQ, SPAD, gH+, kP700, leaf angle, leaf_thickness, pump, qL, tP700, test_data_raw_PAM, vH+, v_initial_P700";
    const NBI_HEADERS = "NBI, Chl, Flav";

    const clickUploadZone = document.getElementById('clickUploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyListTip = document.getElementById('emptyListTip');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const tablePlaceholder = document.getElementById('tablePlaceholder');
    const dataTable = document.getElementById('dataTable');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const targetHeadersInput = document.getElementById('targetHeadersInput');

    function setPreset(type) {
      if (type === 'zhipu') {
        document.getElementById('apiBaseUrl').value = 'https://open.bigmodel.cn/api/paas/v4';
        document.getElementById('apiModel').value = 'glm-4v-flash';
      }
      saveApiSettings();
    }

    function updateModeUI() {
      const btnPAM = document.getElementById('btn-PAM');
      const btnNBI = document.getElementById('btn-NBI');
      const title = document.getElementById('header-title');

      if (currentMode === 'PAM') {
          btnPAM.className = "text-indigo-700 font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-200 flex items-center gap-1.5 transition-all text-[10px] sm:text-xs";
          btnNBI.className = "text-slate-500 hover:text-emerald-700 font-medium bg-transparent px-3 py-1.5 rounded-lg border border-transparent flex items-center gap-1.5 transition-all text-[10px] sm:text-xs";
          title.innerText = "光合仪";
      } else {
          btnNBI.className = "text-emerald-700 font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-200 flex items-center gap-1.5 transition-all text-[10px] sm:text-xs";
          btnPAM.className = "text-slate-500 hover:text-indigo-700 font-medium bg-transparent px-3 py-1.5 rounded-lg border border-transparent flex items-center gap-1.5 transition-all text-[10px] sm:text-xs";
          title.innerText = "氮平衡仪";
      }
    }

    window.setInstrument = function(mode) {
      if (currentMode === mode) return; 

      saveTableData();
      saveApiSettings();

      currentMode = mode;
      localStorage.setItem('active_instrument_mode', currentMode);
      
      updateModeUI();
      loadApiSettings();
      filesState = []; 
      loadTableData(); 
    };

    function getStorageKey() { return `extracted_data_state_precision_v1_${currentMode}`; }
    function getHeadersKey() { return `user_target_headers_precision_v1_${currentMode}`; }

    function loadApiSettings() {
      document.getElementById('apiBaseUrl').value = localStorage.getItem('api_base_url') || 'https://open.bigmodel.cn/api/paas/v4';
      document.getElementById('apiModel').value = localStorage.getItem('api_model') || 'glm-4v-flash';
      document.getElementById('apiKey').value = localStorage.getItem('api_key') || '';
      
      const defaultHeaders = currentMode === 'PAM' ? PAM_HEADERS : NBI_HEADERS;
      const savedHeaders = localStorage.getItem(getHeadersKey());
      targetHeadersInput.value = savedHeaders || defaultHeaders;
      
      updateColumnsFromInput();
    }

    function saveApiSettings() {
      localStorage.setItem('api_base_url', document.getElementById('apiBaseUrl').value.trim());
      localStorage.setItem('api_model', document.getElementById('apiModel').value.trim());
      localStorage.setItem('api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem(getHeadersKey(), targetHeadersInput.value.trim());
      updateColumnsFromInput();
    }

    function updateColumnsFromInput() {
      const raw = targetHeadersInput.value.split(',');
      const parsed = raw.map(h => h.trim()).filter(Boolean);
      if (parsed.length > 0) {
        allColumns = ["样本名称", ...parsed];
        renderTable();
      }
    }

    targetHeadersInput.addEventListener('input', saveApiSettings);
    ['apiBaseUrl', 'apiModel', 'apiKey'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveApiSettings);
    });

    function saveTableData() {
      const stateToSave = filesState.map(f => ({
        id: f.id, customName: f.customName, status: f.status, data: f.data, errorMsg: f.errorMsg, thumb: f.thumb
      }));
      localStorage.setItem(getStorageKey(), JSON.stringify(stateToSave));
    }

    function loadTableData() {
      const savedState = localStorage.getItem(getStorageKey());
      fileList.innerHTML = '';
      filesState = [];
      if (savedState) {
        filesState = JSON.parse(savedState);
        if (filesState.length > 0) {
          emptyListTip.classList.add('hidden');
          filesState.forEach(item => {
            if (item.status === 'processing') item.status = 'pending';
            renderQueueItemDOM(item);
          });
        } else {
          fileList.appendChild(emptyListTip);
          emptyListTip.classList.remove('hidden');
        }
      } else {
        fileList.appendChild(emptyListTip);
        emptyListTip.classList.remove('hidden');
      }
      renderTable();
      updateUI();

    function createThumbnail(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 120; 
            let w = img.width, h = img.height;
            if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
            else if (h > MAX) { w *= MAX / h; h = MAX; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 强效 4K 原生图片无损提取引擎
    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_SIZE = 4096; 
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.95)); 
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function handleNewFiles(files) {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { alert('请先在上方填入 API 密钥！'); return; }
      
      for (const file of Array.from(files)) {
        if (!file.type.startsWith('image/')) continue;
        
        const thumbBase64 = await createThumbnail(file); 
        const fileId = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        const item = { id: fileId, customName: file.name.replace(/\.[^/.]+$/, ""), status: 'pending', data: null, errorMsg: '', thumb: thumbBase64 };
        filesState.push(item);
        renderQueueItemDOM(item);
        setTimeout(() => fileList.scrollTop = fileList.scrollHeight, 50);

        // 使用火线后台处理，直接把 4K 大图锁死进 IndexedDB
        compressImageToBase64(file).then(base64 => {
            saveImageToCache(fileId, base64);
        }).catch(e => console.error('图片落库失败', e));
      }
      saveTableData();
      updateUI();
      if (!isProcessing) processQueue();
    }

    function getTargetHeaders() {
      const raw = targetHeadersInput.value.split(',');
      return raw.map(h => h.trim()).filter(Boolean);
    }

    function mapKeyToTarget(rawKey, targets) {
      let key = (rawKey || '').trim();
      let lower = key.toLowerCase().replace(/[_]+/g, ' ').replace(/\s+/g, ' ');

      // 先做精确的小写比对，防止 Chamber/Leaf 这种包含共同词根 (Temperature) 的情况混淆
      for (const t of targets) {
        if (t.toLowerCase() === lower) return t;
      }

      const hasDiffTarget = targets.some(t => t.toLowerCase().includes('differen'));
      if (hasDiffTarget && (lower.includes('leaf temperature differen') || lower.includes('differential'))) {
        for (const t of targets) {
          if (t.toLowerCase().includes('differen')) return t;
        }
      }

      // 最后模糊比对
      for (const t of targets) {
        let tLower = t.toLowerCase();
        if (lower.includes(tLower) || tLower.includes(lower)) return t;
      }
      return key;
    }

    async function processQueue() {
      isProcessing = true;
      while (true) {
        const pendingItem = filesState.find(f => f.status === 'pending');
        if (!pendingItem) break;
        
        pendingItem.status = 'processing';
        updateQueueItemUI(pendingItem);
        
        try {
          let base64 = await getImageFromCache(pendingItem.id);
          let retryCount = 0;
          while (!base64 && retryCount < 10) {
              await sleep(500);
              base64 = await getImageFromCache(pendingItem.id);
              retryCount++;
          }

          if (!base64) {
             throw new Error('原图缓存已丢失，请删除本条并重新拖入图片。');
          }

          const rawEntries = await callVisionApiEntries(base64);
          const targets = getTargetHeaders();
          const alignedData = {};

          rawEntries.forEach(([k, val]) => {
            const standardKey = mapKeyToTarget(k, targets);
            const strVal = (val !== undefined && val !== null) ? String(val).trim() : '';

            if (strVal && strVal !== '-' && (alignedData[standardKey] === undefined || alignedData[standardKey] === '-' || alignedData[standardKey] === '')) {
              alignedData[standardKey] = strVal;
            } else if (alignedData[standardKey] === undefined) {
              alignedData[standardKey] = strVal;
            }
            
            if (!allColumns.includes(standardKey) && standardKey !== "样本名称") {
              allColumns.push(standardKey);
            }
          });

          pendingItem.status = 'success';
          pendingItem.data = alignedData;

        } catch (err) {
          pendingItem.status = 'error';
          pendingItem.errorMsg = err.message || '识别失败';
        }
        
        updateQueueItemUI(pendingItem);
        renderTable();
        updateUI();
        saveTableData();
        
        setTimeout(() => {
          const wrapper = document.getElementById('tableWrapper');
          wrapper.scrollTop = wrapper.scrollHeight;
        }, 50);

        await sleep(1000);
      }
      isProcessing = false;
    }

    async function callVisionApiEntries(base64Url) {
      let baseUrl = document.getElementById('apiBaseUrl').value.trim().replace(/\/+$/, '');
      const model = document.getElementById('apiModel').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim().replace(/[\u4e00-\u9fa5\s]/g, '');

      if (!baseUrl.endsWith('/chat/completions')) baseUrl += '/chat/completions';

      const targets = getTargetHeaders();
      const targetsStr = targets.join(', ').toLowerCase();
      
      let specialNote = "";
      if (currentMode === 'PAM') {
        // 🌟 核心升级：防幻觉强硬指令，严禁张冠李戴
        specialNote = `\n【⚠️ 提取防错红线警告】：\n1. 务必全图扫描提取 "protocol_id" (通常在最顶部)。\n2. 严格区分 "Chamber Temperature"、"Ambient Temperature" 与 "Leaf Temperature"。如果图中**没有**某个指标(比如缺少 Chamber Temperature)，请【直接跳过，绝不允许张冠李戴】用其他温度去凑数！！找不到就不要输出该 key！\n3. "Leaf Temperature Differenial" (拼写可能少t)，绝对不能漏掉！`;
      } else if (currentMode === 'NBI') {
        specialNote = `\n【⚠️ 氮平衡仪强制提取规则 (极其重要)】：\n图片为氮平衡仪屏幕，分为左右两列。左侧为指标(NBI, Chl, Flav)，右侧为系统参数(如 grp 1, mes 29, sup)。\n你【必须彻底无视右侧】的所有内容！绝对只提取左侧的 3 个纯数值！\n\n正确的返回格式必须是：\n{\n  "NBI": "57.9",\n  "Chl": "35.9",\n  "Flav": "0.62"\n}`;
      }

      const systemPrompt = `你是一个精密的科学仪器数据提取系统。请仔细观察图片，提取以下【目标指标列表】中的数值：
[${targets.join(', ')}]
${specialNote}

强制执行规则：
1. 请从上到下完整扫描图片，严格提取对应的数值。不要带任何单位，只要纯数字（包含小数点或负号）。
2. 【最高优先级红线警告】：绝对、永远、禁止输出任何形式的代码注释（如 // 或 /* */），绝对不要有任何多余的废话和标记！
3. 直接输出纯净的 JSON 字典。
返回格式如：
{
  "${targets[0] || 'protocol_id'}": "123.45"
}`;

      const response = await fetch(baseUrl, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'Authorization': `Bearer ${apiKey}` 
        },
        body: JSON.stringify({
          model: model,
          temperature: 0.01,
          messages: [
            { 
              role: "user", 
              content: [ 
                { type: "text", text: systemPrompt }, 
                { type: "image_url", image_url: { url: base64Url } } 
              ] 
            }
          ]
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        let errMsg = errJson.error?.message || `请求被拒绝 [HTTP ${response.status}]`;
        if (response.status === 404) errMsg = `[404] 模型 ${model} 不存在或地址有误`;
        if (response.status === 401) errMsg = `[401] 密钥无效`;
        if (response.status === 403) errMsg = `[403] 权限拒绝(请检查额度/模型权限)`;
        throw new Error(errMsg);
      }

      const res = await response.json();
      let rawText = res.choices?.[0]?.message?.content || '[]';
      
      let finalEntries = [];
      
      function extractPairs(obj) {
        if (typeof obj !== 'object' || obj === null) return;
        if (obj.key !== undefined && obj.value !== undefined) {
           finalEntries.push([String(obj.key), String(obj.value)]);
        } else {
           for (let k in obj) {
               finalEntries.push([String(k), String(obj[k])]);
           }
        }
      }

      let parsedData = null;
      try {
        let cleanText = rawText.replace(/```json/gi, '').replace(/```/g, '');
        cleanText = cleanText.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1').trim(); 
        
        const arrMatch = cleanText.match(/\[[\s\S]*\]/);
        const objMatch = cleanText.match(/\{[\s\S]*\}/);
        
        if (arrMatch) {
            parsedData = JSON.parse(arrMatch[0]);
        } else if (objMatch) {
            parsedData = JSON.parse(objMatch[0]);
        }
      } catch (e) {
         console.warn("标准 JSON 解析遇阻，已自动激活底层正则刮取引擎...");
      }

      if (parsedData) {
         if (Array.isArray(parsedData)) {
            parsedData.forEach(item => extractPairs(item));
         } else {
            extractPairs(parsedData);
         }
      }

      if (finalEntries.length === 0) {
         const regexKV = /"key"\s*:\s*"([^"]+)"\s*,\s*"value"\s*:\s*"?([^"}\s,\]]+)"?/gi;
         let regMatch;
         let matched = false;
         while ((regMatch = regexKV.exec(rawText)) !== null) {
            finalEntries.push([regMatch[1], regMatch[2]]);
            matched = true;
         }
         if (!matched) {
            const regexDict = /"([^"]+)"\s*:\s*"?([^"}\s,\]]+)"?/gi;
            while ((regMatch = regexDict.exec(rawText)) !== null) {
               if (regMatch[1].toLowerCase() === "key" || regMatch[1].toLowerCase() === "value") continue; 
               finalEntries.push([regMatch[1], regMatch[2]]);
            }
         }
      }

      if (finalEntries.length === 0) {
         throw new Error("AI 数据格式严重损坏，且强制还原失败。");
      }

      return finalEntries;
    }

            if (col === "样本名称") return `<td class="relative group/td px-1 sm:px-2 py-1 font-sans font-bold text-slate-800 border-b border-slate-100 border-r border-slate-100/50 whitespace-nowrap ${cellBg}"><input type="text" data-index="${index}" data-col="样本名称" value="${escapeHtml(item.customName)}" title="${escapeHtml(item.customName)}" class="bg-transparent hover:bg-white focus:bg-white px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-md sm:rounded-lg outline-none transition-all w-full text-center text-[10px] sm:text-xs min-w-[80px]" onchange="updateItemName('${item.id}', this.value)"></td>`;
            const val = item.data[col] !== undefined ? item.data[col] : '';
            return `<td class="px-1 sm:px-2 py-1 border-b border-slate-100 border-r border-slate-100/50 whitespace-nowrap ${cellBg} transition-colors text-center"><input type="text" data-index="${index}" data-col="${escapeHtml(col)}" value="${escapeHtml(val)}" class="text-slate-600 bg-transparent hover:bg-slate-50 focus:bg-white px-1 sm:px-2 py-1.5 sm:py-2 border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-md sm:rounded-lg outline-none transition-all w-full placeholder:text-slate-200 text-center text-[10px] sm:text-xs" placeholder="-" onchange="updateCellValue('${item.id}', '${escapeHtml(col).replace(/'/g, "\\'")}', this.value)"></td>`;
          }).join('')}<td class="px-1 sm:px-2 py-1 border-b border-slate-100 whitespace-nowrap text-center sticky right-0 z-10 shadow-[-8px_0_12px_-4px_rgba(0,0,0,0.02)] transition-colors bg-white group-hover/tr:bg-indigo-50/40"><button onclick="deleteRowItem('${item.id}')" class="w-6 h-6 sm:w-7 sm:h-7 mx-auto flex items-center justify-center rounded-md text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all opacity-0 group-hover/tr:opacity-100"><i class="fa-solid fa-trash-can text-[10px] sm:text-[11px]"></i></button></td></tr>`;
      }).join('');
    }

    // 原生 Excel 导出
    exportCsvBtn.addEventListener('click', () => {
      const successfulItems = filesState.filter(f => f.status === 'success' && f.data);
      if (!successfulItems.length) return;
      
      const aoa = [allColumns];
      successfulItems.forEach(item => {
        const row = allColumns.map(col => {
          if (col === "样本名称") return item.customName;
          let val = item.data[col] !== undefined ? item.data[col] : "";
          if(!isNaN(Number(val)) && val !== "") return Number(val);
          return val;
        });
        aoa.push(row);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "数据记录");
      
      const prefix = currentMode === 'PAM' ? '光合仪' : '氮平衡仪';
      XLSX.writeFile(wb, `${prefix}提取结果_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    clearAllBtn.addEventListener('click', async () => {
      if (!filesState.length) return;
      const name = currentMode === 'PAM' ? '光合仪' : '氮平衡仪';
      if (confirm(`确定要清空【${name}】工作区的所有缓存吗？\n注意：此操作不可恢复，但不会影响另一个仪器的数据。`)) {
        if (db) {
           const tx = db.transaction('images', 'readwrite');
           filesState.forEach(f => tx.objectStore('images').delete(f.id));
        }
        filesState = []; 
        updateColumnsFromInput();
        fileList.innerHTML = ''; 
        fileList.appendChild(emptyListTip);
        emptyListTip.classList.remove('hidden'); 
        renderTable(); 
        updateUI();
        localStorage.removeItem(getStorageKey());
      }
    });

    function updateUI() {
      fileCountBadge.innerText = `${filesState.length} 项`;
      exportCsvBtn.disabled = !filesState.some(f => f.status === 'success');
    }

    (async function initApp() {
      updateModeUI();
      loadApiSettings();
      try {
        await initDB();
      } catch (e) {
        console.warn("⚠️ 警告：无法启动本地图片数据库！如果处于无痕模式或微信内置浏览器，刷新后原图记忆会丢失。", e);
      }
      try {
        loadTableData();
      } catch (e) {
        console.error("加载记忆数据失败", e);
      }
    })();
  </script>
</body>
</html>
